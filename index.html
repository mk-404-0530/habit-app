<style>

*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Yu Gothic",YuGothic,sans-serif}button,input,select{font:inherit}button{cursor:pointer}body{padding-bottom:env(safe-area-inset-bottom)}#app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:94px}.top{position:sticky;top:0;z-index:20;padding:13px 17px 8px;background:rgba(245,250,251,.86);backdrop-filter:blur(18px);display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;letter-spacing:.18em;font-size:19px}.topRight{display:flex;gap:6px}.iconBtn{width:39px;height:39px;border:0;border-radius:50%;background:#fff;color:#3e7789;box-shadow:0 4px 14px rgba(52,95,107,.08);display:grid;place-items:center}.iconBtn svg{width:21px;height:21px}.main{padding:8px 15px}.screen{display:none}.screen.on{display:block}.hero{height:250px;border-radius:27px;overflow:hidden;position:relative;background:linear-gradient(135deg,#67b6de,#8bcbb0);box-shadow:var(--shadow);margin-bottom:12px}.hero img{width:100%;height:100%;object-fit:cover}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 28%,rgba(15,35,43,.68) 100%)}.heroText{position:absolute;left:18px;right:18px;bottom:17px;z-index:2;color:#fff}.heroMsg{font-size:26px;font-weight:900;text-shadow:0 2px 7px #0008}.heroMeta{font-size:11px;margin-top:6px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:15px}.stat{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:0 3px 12px rgba(71,121,137,.06)}.stat b{display:block;font-size:21px}.stat span{font-size:10px;color:var(--muted)}h2{font-size:20px;margin:18px 2px 10px}h3{font-size:15px;margin:16px 2px 8px}.sectionTitle{display:flex;align-items:center;justify-content:space-between;margin:17px 2px 9px}.sectionTitle h2{margin:0}.pill{border-radius:99px;padding:6px 10px;background:#edf7fa;color:#4b7d8d;font-size:10px}.panel,.taskCard{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);margin:10px 0}.task{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #edf2f3}.task:last-child{border-bottom:0}.check{width:29px;height:29px;border-radius:50%;border:1.5px solid #a8b9be;background:#fff;color:#fff;display:grid;place-items:center;flex:0 0 auto}.check.done{background:var(--blue);border-color:var(--blue)}.taskMain{flex:1;min-width:0}.taskMain b{font-size:13px}.taskMain small{color:var(--muted);font-size:10px}.taskActions{display:flex;gap:4px;align-items:center}.miniBtn{border:0;border-radius:10px;padding:7px 8px;background:#edf7fa;color:#39758a;font-size:10px;white-space:nowrap}.miniBtn.blue{background:#e3f4fb;color:#2784ae}.miniBtn.green{background:#e8f6ee;color:#37855e}.primary,.secondary,.danger{border:0;border-radius:13px;padding:9px 12px}.primary{background:var(--blue);color:#fff;font-weight:800}.secondary{background:#edf6f8;color:#386a7a}.danger{background:#fff0f0;color:#b44}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.goalCard{height:206px;border-radius:23px;overflow:hidden;position:relative;color:#fff;background:#72b8d7;box-shadow:var(--shadow);cursor:pointer}.goalCard img{width:100%;height:100%;object-fit:cover}.goalCard:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 20%,rgba(12,30,38,.62) 100%)}.goalText{position:absolute;left:15px;right:15px;bottom:14px;z-index:2}.goalText b{font-size:16px;text-shadow:0 2px 5px #0008}.goalText .small{font-size:10px;margin-top:4px;text-shadow:0 1px 4px #0008}.goalTag{display:inline-block;margin-bottom:5px;padding:3px 7px;border-radius:99px;background:#fff4;border:1px solid #fff7;font-size:9px}.glassStat{display:inline-flex;gap:5px;align-items:center;margin-top:7px;margin-right:4px;padding:5px 8px;border-radius:10px;background:rgba(255,255,255,.38);color:#21434f;font-size:9px;backdrop-filter:blur(7px)}.goalListCard{height:168px;border-radius:22px;overflow:hidden;position:relative;background:#dfecef;display:grid;grid-template-columns:47% 53%;box-shadow:var(--shadow);margin:10px 0;cursor:pointer}.goalListPhoto{height:100%;overflow:hidden}.goalListPhoto img{width:100%;height:100%;object-fit:cover}.goalInfo{position:relative;overflow:hidden;padding:16px 14px;display:flex;flex-direction:column;justify-content:center}.goalInfo:before{content:"";position:absolute;inset:0;background:rgba(255,255,255,.38);backdrop-filter:blur(11px)}.goalInfo>*{position:relative;z-index:1}.goalInfo h3{font-size:16px;margin:0 0 5px}.goalInfo .muted{margin-bottom:8px}.goalInfoRow{display:flex;gap:5px;flex-wrap:wrap}.goalInfo .chip{background:rgba(255,255,255,.6);border-radius:9px;padding:5px 7px;font-size:9px}.progress{height:7px;background:#e5eef0;border-radius:99px;overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;background:var(--blue);border-radius:99px}.rewardCard{height:170px;border-radius:22px;overflow:hidden;position:relative;background:#dfecef;display:grid;grid-template-columns:47% 53%;box-shadow:var(--shadow);margin:10px 0;cursor:pointer}.rewardPhoto{height:100%;overflow:hidden;background:linear-gradient(135deg,#f5df91,#fff)}.rewardPhoto img{width:100%;height:100%;object-fit:cover}.rewardInfo{position:relative;overflow:hidden;padding:16px 14px;display:flex;flex-direction:column;justify-content:center}.rewardInfo:before{content:"";position:absolute;inset:0;background:rgba(255,255,255,.38);backdrop-filter:blur(11px)}.rewardInfo>*{position:relative;z-index:1}.rank{font-size:12px;font-weight:900;letter-spacing:.08em}.rewardInfo h3{margin:3px 0 5px;font-size:16px}.rewardHp{font-size:22px;font-weight:900}.rankS .rewardHp,.rankS .rank{color:#b1881e}.rankA .rewardHp,.rankA .rank{color:#4e9773}.rankB .rewardHp,.rankB .rank{color:#cf6575}.bankLog{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #edf2f3}.bankLog:last-child{border-bottom:0}.logIcon{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto}.logIcon svg{width:20px;height:20px}.logText{flex:1;min-width:0}.logText b{font-size:12px}.logText small{display:block;color:var(--muted);font-size:9px;margin-top:2px}.logHp{font-weight:900;font-size:13px}.blueText{color:var(--blue)}.greenText{color:var(--green)}.orangeText{color:var(--orange)}.redText{color:var(--red)}.filterRow{display:flex;gap:6px;overflow:auto;padding:3px 1px 7px}.filterBtn{white-space:nowrap;border:0;border-radius:99px;background:#edf6f8;color:#577a86;padding:7px 10px;font-size:10px}.filterBtn.on{background:#55acd7;color:#fff;font-weight:800}.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.photo{aspect-ratio:1;overflow:hidden;border-radius:13px;position:relative;background:#e9f1f3}.photo img{width:100%;height:100%;object-fit:cover}.photo button{position:absolute;right:4px;top:4px;border:0;background:#10222b99;color:#fff;border-radius:50%;width:24px;height:24px}.notice{background:#edf7fa;color:#547582;padding:10px 12px;border-radius:14px;font-size:10px;line-height:1.6}.form label{display:block;font-size:11px;color:#607780;margin:12px 0 5px}.form input,.form select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--ink);outline:none}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.colors{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}.color{height:28px;border:2px solid transparent;border-radius:8px}.color.sel{border-color:#18313b;box-shadow:0 0 0 2px #fff inset}.modal{display:none;position:fixed;inset:0;background:#10222b66;z-index:50;align-items:flex-end}.modal.open{display:flex}.sheet{width:100%;max-width:760px;margin:auto;background:#f5fafb;border-radius:26px 26px 0 0;padding:18px;max-height:92vh;overflow:auto}.sheetHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.close{border:0;background:#eaf2f4;border-radius:50%;width:34px;height:34px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}.day{aspect-ratio:1;border-radius:8px;display:grid;place-items:center;font-size:9px;background:#edf3f5;color:#73858c}.day.done{background:var(--c,#55acd7);color:#fff;font-weight:800}.day.today{outline:2px solid #18313b}.empty{text-align:center;color:var(--muted);padding:25px 10px;font-size:12px}.bottomNav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(760px,100%);z-index:30;padding:7px 8px calc(7px + env(safe-area-inset-bottom));background:rgba(255,255,255,.93);backdrop-filter:blur(18px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);gap:2px}.bottomNav button{border:0;background:transparent;color:#7c9097;font-size:9px;padding:5px 2px}.bottomNav button.on{color:#2787af;font-weight:800}.bottomNav .ico{height:22px;display:grid;place-items:center;margin-bottom:2px}.bottomNav svg{width:20px;height:20px}.settingRow{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid #edf2f3}.settingRow:last-child{border-bottom:0}.settingRow b{font-size:13px}.settingRow small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.toggle{width:44px;height:26px;border:0;border-radius:99px;background:#ccdadd;padding:3px}.toggle i{display:block;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}.toggle.on{background:var(--blue)}.toggle.on i{transform:translateX(18px)}.detailHero{height:245px;border-radius:23px;overflow:hidden;position:relative;background:#dcecef;margin-bottom:12px}.detailHero img{width:100%;height:100%;object-fit:cover}.detailHero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 38%,rgba(10,28,36,.72))}.detailHeroText{position:absolute;z-index:2;left:16px;right:16px;bottom:16px;color:#fff}.detailHeroText h2{margin:0;font-size:23px;text-shadow:0 2px 6px #0008}.detailHeroText p{margin:5px 0 0;font-size:10px}.iconLabel{display:flex;align-items:center;gap:7px}.subtle{font-size:10px;color:var(--muted)}
@media(max-width:420px){.grid{gap:8px}.goalCard{height:192px}.hero{height:232px}.summary{gap:6px}.stat{padding:10px}.goalListCard,.rewardCard{grid-template-columns:46% 54%;height:160px}.goalInfo,.rewardInfo{padding:13px 11px}.photos{grid-template-columns:repeat(4,1fr)}}

<body>
<div id="app">
<header class="top"><div><div class="brand">HABIT</div></div><div class="topRight"><button id="bellBtn" class="iconBtn" aria-label="リマインド"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg></button></div></header>
<main class="main">
<section id="home" class="screen on"></section>
<section id="goals" class="screen"></section>
<section id="rewards" class="screen"></section>
<section id="bank" class="screen"></section>
<section id="settings" class="screen"></section>
</main>
<nav class="bottomNav">
<button data-s="home" class="on"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/></svg></span>ホーム</button>
<button data-s="goals"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M5 20V4"/><path d="M5 5h12l-2.5 3L17 11H5"/><path d="M4 20h4"/></svg></span>目標</button>
<button data-s="rewards"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h16v12H4z"/><path d="M12 8v12M4 12h16"/><path d="M12 8H8.5C6 8 5.5 5 7.5 4c2.3-1.1 4.5 2.7 4.5 4ZM12 8h3.5c2.5 0 3-3 1-4-2.3-1.1-4.5 2.7-4.5 4Z"/></svg></span>ご褒美</button>
<button data-s="bank"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 5h16v14H4z"/><path d="M4 8h16M7 12h4M7 15h7"/><path d="M16 12h1"/></svg></span>HP通帳</button>
<button data-s="settings"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 8.2a3.8 3.8 0 1 0 0 7.6 3.8 3.8 0 0 0 0-7.6Z"/><path d="m19.4 15 .1 1.9-1.8 1.1-1.6-1a8.1 8.1 0 0 1-2.1.9L13.5 20h-3l-.5-2.1a8.1 8.1 0 0 1-2.1-.9l-1.8 1-1.7-1.1.1-1.9a8.2 8.2 0 0 1-1.1-2l-1.8-.8.3-2 1.8-.6a8 8 0 0 1 1-2.1L4.6 5.7l1.7-1.1 1.6 1a8.1 8.1 0 0 1 2.1-.9L10.5 2h3l.5 2.1a8.1 8.1 0 0 1 2.1.9l1.8-1 1.7 1.1-.1 1.9a8.2 8.2 0 0 1 1.1 2l1.8.8-.3 2-1.8.6a8 8 0 0 1-1 2.1Z"/></svg></span>設定</button>
</nav>

<div id="modal" class="modal"><div id="sheet" class="sheet"></div></div>
<script>
const KEY='habit_v5';
const OLD_KEY='habit_v4';
const COLORS=['#e85d5d','#f48a8a','#f6bd60','#ffd166','#8ac926','#58b77e','#2a9d8f','#00a9c8','#4f8fc1','#536dfe','#7b4bb7','#b24aa0','#ef70a8','#ff9f43','#bd742e','#6a994e','#386641','#577590','#6d597a','#9a8c98','#555','#222','#fff','#ddd'];
const MSG=['おかえり。','今日も一歩。','今日も頑張ろう。','お疲れさま。','またここから。','この調子。','あと少し。'];
const DEFAULT_REWARDS={S:{hp:5000,items:[]},A:{hp:2500,items:[]},B:{hp:500,items:[]}};
let S=JSON.parse(localStorage.getItem(KEY)||'null');
if(!S){
  const old=JSON.parse(localStorage.getItem(OLD_KEY)||'null');
  if(old){
    const oldRewards=old.rewards||{};
    S={goals:old.goals||[],hp:old.hp||0,logs:old.logs||[],rewards:{S:{hp:5000,items:[]},A:{hp:2500,items:[]},B:{hp:500,items:[]}},photos:old.photos||[],reminders:{enabled:true}};
    Object.entries({S:5000,A:2500,B:500}).forEach(([r,hp])=>{
      const items=oldRewards[hp]||[];
      S.rewards[r].items=items.map(x=>typeof x==='string'?{name:x,date:''}:x);
    });
    localStorage.setItem(KEY,JSON.stringify(S));
  }else S={goals:[],hp:0,logs:[],rewards:DEFAULT_REWARDS,photos:[],reminders:{enabled:true}};
}
if(!S.rewards||!S.rewards.S){S.rewards=DEFAULT_REWARDS}
if(!S.reminders)S.reminders={enabled:true};
let T=null;
const $=s=>document.querySelector(s), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const dateOffset=n=>{const d=new Date();d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
function icon(type,color){const c=color||'currentColor';const common=`fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"`;
 if(type==='normal')return `<svg viewBox="0 0 24 24" ${common}><path d="m5 12 4 4L19 6"/></svg>`;
 if(type==='minimum')return `<svg viewBox="0 0 24 24" ${common}><path d="m12 4 2.2 4.6 5.1.7-3.7 3.6.9 5.1-4.5-2.4-4.5 2.4.9-5.1-3.7-3.6 5.1-.7L12 4Z"/></svg>`;
 if(type==='return')return `<svg viewBox="0 0 24 24" ${common}><path d="M12 21c5-3 7-7.3 6.2-12-3.2.4-5.7 2-7.1 4.7C10.5 9.5 8.6 7.6 5 7.1 4.2 12.1 6.4 17.7 12 21Z"/><path d="M12 20c-.6-4.7.4-8.4 4.3-11.2"/></svg>`;
 if(type==='achieve')return `<svg viewBox="0 0 24 24" ${common}><path d="M7 4h10v5c0 4-2.1 6-5 6s-5-2-5-6V4Z"/><path d="M7 6H4v2c0 3 1.5 4.5 4 4.5M17 6h3v2c0 3-1.5 4.5-4 4.5M12 15v4M8 20h8"/></svg>`;
 return `<svg viewBox="0 0 24 24" ${common}><path d="M4 8h16v12H4z"/><path d="M12 8v12M4 12h16"/><path d="M12 8H8.5C6 8 5.5 5 7.5 4c2.3-1.1 4.5 2.7 4.5 4ZM12 8h3.5c2.5 0 3-3 1-4-2.3-1.1-4.5 2.7-4.5 4Z"/></svg>`;
}
function hpToday(){return S.logs.filter(x=>x.date===today()&&x.n>0).reduce((a,x)=>a+x.n,0)}
function addLog(n,name,kind='normal',meta={}){S.hp+=n;S.logs.unshift({date:today(),n,name,kind,...meta});save()}
function randomPhoto(){return S.photos.length?S.photos[Math.floor(Math.random()*S.photos.length)]:''}
function remaining(g){return Math.max(0,Math.ceil((new Date(g.targetDate)-new Date(today()))/86400000)+1)}
function streak(g){const set=new Set(g.done||[]);let n=0;for(let i=0;i<999;i++){if(set.has(dateOffset(-i)))n++;else break}return n}
function stage(g){const p=Math.min(1,(g.done||[]).length/Math.max(1,g.targetDays));return p<.2?1:p<.4?2:p<.6?3:p<.8?4:5}
function goalImage(g){return g.images&&g.images[stage(g)]?g.images[stage(g)]:(g.images&&g.images.find(Boolean)||'')}
function allTasks(){const a=[];S.goals.forEach(g=>(g.tasks||[]).forEach((t,i)=>{if(t.frequency!=='休息日')a.push({g,t,i})}));return a}
function home(){const p=randomPhoto(),m=MSG[Math.floor(Math.random()*MSG.length)],all=allTasks();
 const cards=S.goals.map(g=>`<div class="goalCard" onclick="openGoalDetail('${g.id}')">${goalImage(g)?`<img src="${goalImage(g)}">`:''}<div class="goalText">${g.tag?`<span class="goalTag">${esc(g.tag)}</span>`:''}<b>${esc(g.name)}</b><div class="small">あと${remaining(g)}日　・　${streak(g)}日継続</div><span class="glassStat">継続 ${streak(g)}日</span><span class="glassStat">達成 ${g.done.length}/${g.targetDays}日</span></div></div>`).join('');
 $('#home').innerHTML=`<div class="hero">${p?`<img src="${p}">`:''}<div class="heroText"><div class="heroMsg">${m}</div><div class="heroMeta">今日 ${hpToday()}HP　　累計 ${S.hp}HP</div></div></div><div class="summary"><div class="stat"><b>${S.goals.length}</b><span>目標数</span></div><div class="stat"><b>${S.hp}</b><span>累計HP</span></div><div class="stat"><b>${hpToday()}</b><span>今日のHP</span></div></div><div class="sectionTitle"><h2>今日やること</h2><span class="pill">通常 10HP　最低 5HP</span></div><div class="taskCard">${all.length?all.map(x=>{const done=x.t.done?.includes(today());return `<div class="task"><button class="check ${done?'done':''}" onclick="event.stopPropagation();doTask('${x.g.id}',${x.i},10)">${done?'✓':'○'}</button><div class="taskMain"><b>${esc(x.t.normal)}</b><br><small>${esc(x.g.name)}　・ 最低 ${esc(x.t.minimum)}</small></div><div class="taskActions"><button class="miniBtn blue" onclick="event.stopPropagation();doTask('${x.g.id}',${x.i},10)">通常 10HP</button><button class="miniBtn green" onclick="event.stopPropagation();doTask('${x.g.id}',${x.i},5)">最低 5HP</button></div></div>`}).join(''):`<div class="empty">今日の行動は全部完了。<br>休むのも行動。</div>`}</div><div class="sectionTitle"><h2>大目標</h2><span class="pill">${S.goals.length}個</span></div><div class="grid">${cards||`<div class="empty">まだ大目標がない。<br>「目標」から追加しよう。</div>`}</div>`}
function goals(){const cards=S.goals.map(g=>`<div class="goalListCard" onclick="openGoalDetail('${g.id}')"><div class="goalListPhoto">${goalImage(g)?`<img src="${goalImage(g)}">`:''}</div><div class="goalInfo"><h3>${esc(g.name)}</h3><div class="muted">${esc(g.tag||'タグなし')}　・　あと${remaining(g)}日</div><div class="goalInfoRow"><span class="chip">継続 ${streak(g)}日</span><span class="chip">達成 ${g.done.length}/${g.targetDays}</span></div><div class="progress"><i style="width:${Math.min(100,g.done.length/Math.max(1,g.targetDays)*100)}%"></i></div><div class="subtle" style="margin-top:7px">タップして目標詳細へ</div></div></div>`).join('');
 $('#goals').innerHTML=`<div class="sectionTitle"><h2>目標</h2><button class="primary" onclick="openGoalForm()">＋ 大目標を追加</button></div>${cards||'<div class="panel empty">まだ目標がない。<br>ここから一つ作ろう。</div>'}`}
function rewards(){const data=[['S','Sランク','rankS'],['A','Aランク','rankA'],['B','Bランク','rankB']];$('#rewards').innerHTML=`<div class="sectionTitle"><div><h2>ご褒美</h2><div class="muted">現在 ${S.hp}HP</div></div><button class="secondary" onclick="openRewardSettings()">HP設定</button></div>${data.map(([r,label,cls])=>{const o=S.rewards[r];const first=o.items[0];return `<div class="rewardCard ${cls}" onclick="openRewardDetail('${r}')"><div class="rewardPhoto">${first&&first.photo?`<img src="${first.photo}">`:''}</div><div class="rewardInfo"><div class="rank">${label}</div><h3>${first?esc(first.name):'ご褒美を登録'}</h3><div class="rewardHp">${o.hp}HP</div><div class="subtle">${o.items.length}件　・　タップして一覧</div></div></div>`}).join('')}`}
function bank(){const labels={all:'すべて',normal:'通常',minimum:'最低',return:'再開',achieve:'達成',reward:'ご褒美'};const filter=S.bankFilter||'all';const logs=filter==='all'?S.logs:S.logs.filter(x=>x.kind===filter);$('#bank').innerHTML=`<div class="sectionTitle"><div><h2>HP通帳</h2><div class="muted">残高 ${S.hp}HP</div></div></div><div class="filterRow">${Object.entries(labels).map(([k,v])=>`<button class="filterBtn ${filter===k?'on':''}" onclick="S.bankFilter='${k}';save();bank()">${v}</button>`).join('')}</div><div class="panel">${logs.length?logs.map(x=>{const positive=x.n>=0;const color=x.kind==='normal'||x.kind==='minimum'?'#55acd7':x.kind==='return'?'#69b98e':x.kind==='achieve'?'#e89b45':'#df6d70';const type=x.kind==='normal'?'normal':x.kind==='minimum'?'minimum':x.kind==='return'?'return':x.kind==='achieve'?'achieve':'reward';return `<div class="bankLog"><div class="logIcon" style="background:${color}22">${icon(type,color)}</div><div class="logText"><b>${esc(x.name)}</b><small>${x.date}${x.rank?`　・　${x.rank}`:''}</small></div><div class="logHp ${x.kind==='normal'||x.kind==='minimum'?'blueText':x.kind==='return'?'greenText':x.kind==='achieve'?'orangeText':'redText'}">${positive?'+':''}${x.n}HP</div></div>`}).join(''):`<div class="empty">まだHPの記録がない。</div>`}</div>`}
function settings(){const count=S.photos.length;$('#settings').innerHTML=`<div class="sectionTitle"><h2>設定</h2></div><div class="panel"><div class="settingRow"><div><b>リマインド</b><small>行動目標ごとの時刻設定</small></div><button class="secondary" onclick="openReminderSettings()">設定</button></div><div class="settingRow"><div><b>リマインド有効</b><small>アプリを開いている間に時刻を確認</small></div><button class="toggle ${S.reminders.enabled?'on':''}" onclick="S.reminders.enabled=!S.reminders.enabled;save();settings()"><i></i></button></div><div class="settingRow"><div><b>お気に入り写真</b><small>${count}/100枚　起動時ランダム表示</small></div><button class="secondary" onclick="openPhotoManager()">写真を管理</button></div></div><div class="panel"><h3 style="margin-top:0">データ</h3><div class="notice">記録と写真はこの端末のブラウザ内に保存されます。アプリのテスト運用中はSafariのWebサイトデータを削除しないでください。</div></div>`}
function render(){home();goals();rewards();bank();settings();checkReturnBonuses()}
function checkReturnBonuses(){const d=today(),y=dateOffset(-1);let changed=false;S.goals.forEach(g=>{if(g.returnBonusDate===d)return;const active=(g.tasks||[]).filter(t=>t.frequency!=='休息日');if(!active.length)return;const missed=active.some(t=>!(t.done||[]).includes(y));const resumed=active.some(t=>(t.done||[]).includes(d));if(missed&&resumed){addLog(10,'再開：'+g.name,'return');g.returnBonusDate=d;changed=true}});if(changed)save()}
function doTask(id,i,hp){const g=S.goals.find(x=>x.id===id),t=g?.tasks?.[i],d=today();if(!g||!t||t.frequency==='休息日'||t.done?.includes(d))return;const earned=Math.min(hp,Math.max(0,50-hpToday()));t.done=t.done||[];t.done.push(d);g.done=g.done||[];if(!g.done.includes(d))g.done.push(d);if(earned>0)addLog(earned,'目標：'+g.name+' / '+(hp===10?t.normal:t.minimum),hp===10?'normal':'minimum');if(g.done.length>=g.targetDays&&!g.finished){g.finished=true;addLog(500,'達成：'+g.name,'achieve')}save();render()}
function openGoalDetail(id){const g=S.goals.find(x=>x.id===id);if(!g)return;const cal=[];for(let i=0;i<Math.min(g.targetDays,70);i++){const d=new Date(g.startDate);d.setDate(d.getDate()+i);const s=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;cal.push(`<span class="day ${g.done.includes(s)?'done':''} ${s===today()?'today':''}" style="--c:${g.color}">${d.getDate()}</span>`)}$('#sheet').innerHTML=`<div class="sheetHead"><h2 style="margin:0">目標詳細</h2><button class="close" onclick="closeModal()">×</button></div><div class="detailHero">${goalImage(g)?`<img src="${goalImage(g)}">`:''}<div class="detailHeroText"><h2>${esc(g.name)}</h2><p>${esc(g.tag||'タグなし')}　・　あと${remaining(g)}日</p></div></div><div class="kpi"><span class="pill">継続 ${streak(g)}日</span><span class="pill">達成 ${g.done.length}/${g.targetDays}日</span><span class="pill">達成率 ${Math.round(g.done.length/Math.max(1,g.targetDays)*100)}%</span></div><h3>行動目標</h3><div class="panel">${g.tasks.map((t,i)=>`<div class="task"><div class="iconLabel"><span class="logIcon" style="background:#55acd722">${icon('normal','#55acd7')}</span><div class="taskMain"><b>${esc(t.normal)}</b><small>最低：${esc(t.minimum)}　${esc(t.frequency)}${t.reminder?'　・　'+esc(t.reminder):''}</small></div></div></div>`).join('')||'<div class="empty">行動目標なし</div>'}</div><h3>達成カレンダー</h3><div class="panel"><div class="calendar" style="--c:${g.color}">${cal.join('')}</div></div><div class="row" style="margin-top:14px"><button class="primary grow" onclick="closeModal();openGoalForm('${g.id}')">目標を編集</button><button class="danger" onclick="deleteGoal('${g.id}')">削除</button></div>`;openModal()}
function openGoalForm(id){const g=S.goals.find(x=>x.id===id);T=g?JSON.parse(JSON.stringify(g)):{id:crypto.randomUUID(),name:'',tag:'',targetDate:dateOffset(29),targetDays:30,startDate:today(),weekStart:'mon',color:'#55acd7',done:[],images:['','','','','',''],tasks:[],returnBonusDate:'',finished:false};drawGoalForm();openModal()}
function drawGoalForm(){const o=S.goals.some(g=>g.id===T.id);$('#sheet').innerHTML=`<div class="sheetHead"><h2 style="margin:0">${o?'目標を編集':'大目標を作る'}</h2><button class="close" onclick="closeModal()">×</button></div><div class="form"><label>目標名</label><input id="gn" value="${esc(T.name)}" placeholder="目指せ48kg / 日商簿記2級合格"><div class="two"><div><label>目標タグ</label><input id="gt" value="${esc(T.tag)}" placeholder="勉強"></div><div><label>カレンダー</label><select id="week"><option value="mon" ${T.weekStart!=='sun'?'selected':''}>月曜始まり</option><option value="sun" ${T.weekStart==='sun'?'selected':''}>日曜始まり</option></select></div></div><label>達成目標日</label><input id="gd" type="date" value="${T.targetDate}"><label>日数で設定</label><div class="row"><input id="dn" type="number" min="1" value="${T.targetDays}"><button class="secondary" onclick="calcDateByDays()">この日数で計算</button></div><div id="dc" class="notice" style="margin-top:6px">達成目標日は ${T.targetDate} です。</div><label>達成色</label><div class="colors">${COLORS.map(c=>`<button class="color ${c===T.color?'sel':''}" style="background:${c}" onclick="T.color='${c}';document.querySelectorAll('.color').forEach(x=>x.classList.remove('sel'));this.classList.add('sel')"></button>`).join('')}</div><label>CMYKで色を指定（任意）</label><div class="two"><input id="cy" type="number" min="0" max="100" placeholder="C"><input id="my" type="number" min="0" max="100" placeholder="M"><input id="yk" type="number" min="0" max="100" placeholder="Y"><input id="kk" type="number" min="0" max="100" placeholder="K"></div><button class="secondary" style="margin-top:7px" onclick="applyCMYK()">CMYKの色を適用</button><label>行動目標</label><div id="tasks"></div><button class="secondary" onclick="addTask()">＋ 行動目標を追加</button><label>達成状況画像（5段階）</label><div class="notice">達成率に応じてカード画像が切り替わります。各目標ごとに好きな写真を設定できます。</div><div>${[1,2,3,4,5].map(i=>`<div style="margin:7px 0"><div class="subtle">段階 ${i}</div><input type="file" accept="image/*" onchange="setGoalImage(event,${i})"></div>`).join('')}</div><div class="row" style="margin-top:15px"><button class="primary grow" onclick="saveGoalForm()">保存</button>${o?`<button class="danger" onclick="deleteGoal('${T.id}')">削除</button>`:''}</div></div>`;drawTasks()}
function drawTasks(){const box=$('#tasks');box.innerHTML=T.tasks.map((t,i)=>`<div class="panel"><label>通常行動（10HP）</label><input id="n${i}" value="${esc(t.normal)}" placeholder="簿記を30分"><label>最低ライン（5HP）</label><input id="m${i}" value="${esc(t.minimum)}" placeholder="問題を1問"><div class="two"><div><label>頻度</label><select id="f${i}"><option ${t.frequency==='毎日'?'selected':''}>毎日</option><option ${t.frequency==='平日'?'selected':''}>平日</option><option ${t.frequency==='土日'?'selected':''}>土日</option><option ${t.frequency==='週3回'?'selected':''}>週3回</option><option ${t.frequency==='休息日'?'selected':''}>休息日</option></select></div><div><label>リマインド</label><input id="r${i}" type="time" value="${esc(t.reminder||'')}"></div></div><button class="danger" style="margin-top:9px" onclick="syncTasks();T.tasks.splice(${i},1);drawTasks()">削除</button></div>`).join('')||'<div class="empty">行動目標を追加すると、今日やることが自動で表示される。</div>'}
function syncTasks(){T.tasks.forEach((t,i)=>{const n=$('#n'+i);if(n){t.normal=n.value.trim();t.minimum=$('#m'+i).value.trim();t.frequency=$('#f'+i).value;t.reminder=$('#r'+i).value}})}
function addTask(){syncTasks();T.tasks.push({normal:'',minimum:'',frequency:'毎日',reminder:'',done:[]});drawTasks()}
function calcDateByDays(){const n=Math.max(1,Number($('#dn').value||1));T.startDate=today();const d=new Date();d.setDate(d.getDate()+n-1);T.targetDate=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;$('#gd').value=T.targetDate;$('#dc').textContent='達成目標日は '+T.targetDate+' です。'}
function cmykToHex(c,m,y,k){c/=100;m/=100;y/=100;k/=100;return '#'+[255*(1-c)*(1-k),255*(1-m)*(1-k),255*(1-y)*(1-k)].map(v=>Math.round(v).toString(16).padStart(2,'0')).join('')}
function applyCMYK(){T.color=cmykToHex(Number($('#cy').value||0),Number($('#my').value||0),Number($('#yk').value||0),Number($('#kk').value||0));drawGoalForm()}
function setGoalImage(e,i){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{T.images[i]=r.result;drawGoalForm()};r.readAsDataURL(f)}
function saveGoalForm(){syncTasks();T.name=$('#gn').value.trim();T.tag=$('#gt').value.trim();T.targetDate=$('#gd').value;T.weekStart=$('#week').value;T.targetDays=Math.max(1,Math.ceil((new Date(T.targetDate)-new Date(T.startDate))/86400000)+1);T.tasks=T.tasks.filter(t=>t.normal&&t.minimum);if(!T.name||!T.targetDate)return alert('目標名と目標日を入力して。');const i=S.goals.findIndex(g=>g.id===T.id);if(i>=0)S.goals[i]=T;else{S.goals.push(T);addLog(10,'目標設定：'+T.name,'normal')}save();closeModal();render()}
function deleteGoal(id){if(confirm('この大目標と記録を削除する？')){S.goals=S.goals.filter(g=>g.id!==id);save();closeModal();render()}}
function openRewardDetail(rank){const o=S.rewards[rank];$('#sheet').innerHTML=`<div class="sheetHead"><div><h2 style="margin:0">${rank}ランク</h2><div class="muted">1件 ${o.hp}HP</div></div><button class="close" onclick="closeModal()">×</button></div><div class="panel"><div class="notice">やりたいことを登録して、達成した日に「使う」を押すと累計HPから自動で差し引きます。</div>${o.items.map((x,i)=>`<div class="task"><div class="taskMain"><b>${esc(x.name)}</b><small>${x.date?'登録日 '+x.date:''}</small></div><button class="miniBtn" onclick="useReward('${rank}',${i})">使う</button><button class="danger" onclick="deleteReward('${rank}',${i})">削除</button></div>`).join('')||'<div class="empty">まだご褒美がない。</div>'}<button class="primary" onclick="addReward('${rank}')">＋ ご褒美を追加</button></div>`;openModal()}
function addReward(rank){const name=prompt(rank+'ランクのご褒美を入力');if(name?.trim()){S.rewards[rank].items.push({name:name.trim(),date:today()});save();openRewardDetail(rank);rewards()}}
function deleteReward(rank,i){S.rewards[rank].items.splice(i,1);save();openRewardDetail(rank);rewards()}
function useReward(rank,i){const o=S.rewards[rank],item=o.items[i];if(S.hp<o.hp)return alert('HPが足りない。');if(confirm('「'+item.name+'」を今日のご褒美として使う？')){addLog(-o.hp,'ご褒美：'+item.name,'reward',{rank});closeModal();render()}}
function openRewardSettings(){const vals=S.rewards;$('#sheet').innerHTML=`<div class="sheetHead"><h2 style="margin:0">HP設定</h2><button class="close" onclick="closeModal()">×</button></div><div class="panel form"><label>Sランク 初期 5000HP</label><input id="rs" type="number" min="1" value="${vals.S.hp}"><label>Aランク 初期 2500HP</label><input id="ra" type="number" min="1" value="${vals.A.hp}"><label>Bランク 初期 500HP</label><input id="rb" type="number" min="1" value="${vals.B.hp}"><button class="primary" style="margin-top:14px" onclick="saveRewardSettings()">保存</button></div>`;openModal()}
function saveRewardSettings(){S.rewards.S.hp=Math.max(1,Number($('#rs').value));S.rewards.A.hp=Math.max(1,Number($('#ra').value));S.rewards.B.hp=Math.max(1,Number($('#rb').value));save();closeModal();rewards()}
function openReminderSettings(){const rows=[];S.goals.forEach(g=>(g.tasks||[]).forEach((t,i)=>rows.push(`<div class="settingRow"><div><b>${esc(g.name)}</b><small>${esc(t.normal)}</small></div><input type="time" value="${esc(t.reminder||'')}" onchange="setReminder('${g.id}',${i},this.value)" style="width:110px;padding:8px;border:1px solid var(--line);border-radius:11px;background:#fff"></div>`)));$('#sheet').innerHTML=`<div class="sheetHead"><h2 style="margin:0">リマインド</h2><button class="close" onclick="closeModal()">×</button></div><div class="notice">時刻になると、アプリが開いている場合にリマインドを表示します。ロック中の完全なバックグラウンド通知は、このPWAテスト版では保証しません。</div><div class="panel">${rows.join('')||'<div class="empty">先に目標と行動目標を作ってください。</div>'}</div>`;openModal()}
function setReminder(id,i,v){const g=S.goals.find(x=>x.id===id);if(g&&g.tasks[i]){g.tasks[i].reminder=v;save()}}
function openPhotoManager(){const max=100;$('#sheet').innerHTML=`<div class="sheetHead"><div><h2 style="margin:0">写真</h2><div class="muted">${S.photos.length}/${max}枚</div></div><button class="close" onclick="closeModal()">×</button></div><div class="notice">お気に入り写真は起動時にランダム表示。各目標の5段階画像とは別管理です。</div><label class="primary" style="display:inline-block;margin-top:12px">＋ 写真を追加<input hidden type="file" accept="image/*" multiple onchange="addPhotos(event)"></label><div class="photos" style="margin-top:12px">${S.photos.map((p,i)=>`<div class="photo"><img src="${p}"><button onclick="S.photos.splice(${i},1);save();openPhotoManager();settings()">×</button></div>`).join('')}</div>`;openModal()}
function addPhotos(e){const files=[...e.target.files].slice(0,100-S.photos.length);files.forEach(f=>{const r=new FileReader();r.onload=()=>{S.photos.push(r.result);save();openPhotoManager();settings()};r.readAsDataURL(f)})}
function openModal(){$('#modal').classList.add('open')}
function closeModal(){$('#modal').classList.remove('open')}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));$('#'+id).classList.add('on');document.querySelectorAll('.bottomNav button').forEach(x=>x.classList.toggle('on',x.dataset.s===id));render()}
document.querySelectorAll('.bottomNav button').forEach(b=>b.addEventListener('click',()=>show(b.dataset.s)));
$('#bellBtn').addEventListener('click',openReminderSettings);
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
setInterval(()=>{if(!S.reminders.enabled)return;const hm=new Date().toTimeString().slice(0,5),d=today();S.goals.forEach(g=>(g.tasks||[]).forEach(t=>{if(t.reminder===hm&&t.reminderLast!==d&&!t.done?.includes(d)&&t.frequency!=='休息日'){t.reminderLast=d;save();alert('HABIT\n'+g.name+'\n今日の行動：'+t.normal)}}))},30000);
render();
</script>
</body>
</html>
