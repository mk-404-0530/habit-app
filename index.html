<style>
:root{--bg:#f7fbfc;--card:#fff;--ink:#18313b;--muted:#72848b;--line:#dce8eb;--blue:#4fa9d8;--blue2:#dff3fb;--yellow:#f5cf63;--pink:#f5a9b8;--green:#8bc9b0;--shadow:0 8px 26px rgba(41,89,105,.09)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Yu Gothic",YuGothic,sans-serif}button,input,select{font:inherit}button{cursor:pointer}body{padding-bottom:env(safe-area-inset-bottom)}#app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:94px}.top{padding:18px 18px 10px;position:sticky;top:0;z-index:20;background:rgba(247,251,252,.9);backdrop-filter:blur(16px)}.brand{font-weight:900;letter-spacing:.15em;font-size:20px}.sub{font-size:11px;color:var(--muted);margin-top:2px}.main{padding:10px 16px}.screen{display:none}.screen.on{display:block}.hero{height:255px;border-radius:28px;overflow:hidden;position:relative;background:linear-gradient(135deg,#62b6df,#8bc9b0);box-shadow:var(--shadow);margin-bottom:12px}.hero img{width:100%;height:100%;object-fit:cover}.hero:after,.goal:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 25%,rgba(14,30,37,.76) 100%)}.heroText,.goalText{position:absolute;left:18px;right:18px;bottom:18px;z-index:2;color:#fff}.heroMsg{font-size:27px;font-weight:900;text-shadow:0 2px 7px #0008}.heroMeta{font-size:12px;margin-top:6px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:16px}.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px;box-shadow:0 3px 12px #4779890d}.stat b{display:block;font-size:22px}.stat span{font-size:10px;color:var(--muted)}h2{font-size:20px;margin:18px 2px 10px}h3{font-size:15px;margin:18px 2px 8px}.sectionTitle{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 9px}.sectionTitle h2{margin:0}.pill{border-radius:99px;padding:6px 10px;background:#edf7fa;color:#4c7d8e;font-size:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.goal{height:205px;border-radius:23px;overflow:hidden;position:relative;color:#fff;background:#70b7d7;box-shadow:var(--shadow)}.goal img{width:100%;height:100%;object-fit:cover}.goalText b{font-size:17px;text-shadow:0 2px 5px #0008}.goalText .small{font-size:10px;margin-top:4px}.goalText .tag{display:inline-block;margin-bottom:5px;padding:3px 7px;border-radius:99px;background:#fff4;border:1px solid #fff8;font-size:9px}.taskCard,.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px;box-shadow:0 3px 12px #4779890b;margin:10px 0}.task{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #edf2f3}.task:last-child{border-bottom:0}.check{width:30px;height:30px;border-radius:50%;border:1.5px solid #9db1b8;background:#fff;color:#fff;flex:0 0 auto}.check.done{background:var(--blue);border-color:var(--blue)}.taskMain{flex:1;min-width:0}.taskMain b{font-size:13px}.taskMain small{color:var(--muted);font-size:10px}.miniBtn,.primary,.secondary,.danger{border:0;border-radius:13px;padding:9px 12px}.primary{background:var(--blue);color:#fff;font-weight:700}.secondary{background:#eef6f8;color:#386a7a}.danger{background:#fff0f0;color:#b44}.miniBtn{background:#edf7fa;color:#39728a;font-size:10px}.bottomNav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(760px,100%);z-index:30;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:rgba(255,255,255,.92);backdrop-filter:blur(18px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.bottomNav button{border:0;background:transparent;color:#78909a;font-size:10px;padding:5px}.bottomNav button.on{color:#2283b1;font-weight:800}.bottomNav .ico{font-size:18px;display:block;line-height:1.1;margin-bottom:2px}.fab{position:fixed;right:18px;bottom:88px;width:54px;height:54px;border:0;border-radius:50%;background:var(--blue);color:#fff;font-size:27px;box-shadow:0 8px 22px #398fb455;z-index:29}.row{display:flex;align-items:center;gap:8px}.between{justify-content:space-between}.grow{flex:1}.muted{color:var(--muted);font-size:11px}.notice{background:#edf7fa;color:#547582;padding:10px 12px;border-radius:14px;font-size:10px;line-height:1.6}.reward{border-radius:20px;padding:16px;margin:10px 0;color:#26434d;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow)}.reward.matsu{background:linear-gradient(135deg,#fff8dc,#fff);border-color:#f1d985}.reward.take{background:linear-gradient(135deg,#e9f7f0,#fff);border-color:#b5dbc9}.reward.ume{background:linear-gradient(135deg,#fff0f4,#fff);border-color:#efc0cb}.hp{font-weight:900;color:#2b91bd}.log{padding:10px 0;border-bottom:1px solid #edf2f3;font-size:12px}.positive{color:#2d9a75}.negative{color:#c45c69}.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.photo{aspect-ratio:1;overflow:hidden;border-radius:13px;position:relative;background:#e9f1f3}.photo img{width:100%;height:100%;object-fit:cover}.photo button{position:absolute;right:4px;top:4px;border:0;background:#10222b99;color:#fff;border-radius:50%;width:24px;height:24px}.form label{display:block;font-size:11px;color:#607780;margin:12px 0 5px}.form input,.form select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--ink);outline:none}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.colors{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}.color{height:28px;border:2px solid transparent;border-radius:8px}.color.sel{border-color:#18313b;box-shadow:0 0 0 2px #fff inset}.modal{display:none;position:fixed;inset:0;background:#10222b66;z-index:50;align-items:flex-end}.modal.open{display:flex}.sheet{width:100%;max-width:760px;margin:auto;background:#f7fbfc;border-radius:26px 26px 0 0;padding:18px;max-height:92vh;overflow:auto}.sheetHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.close{border:0;background:#eaf2f4;border-radius:50%;width:34px;height:34px}.preview{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:6px}.preview img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}.day{aspect-ratio:1;border-radius:8px;display:grid;place-items:center;font-size:9px;background:#edf3f5;color:#73858c}.day.done{background:var(--c,#5aaed4);color:#fff;font-weight:800}.day.today{outline:2px solid #18313b}.day.rest{background:#fff8df;color:#9b8138}.empty{text-align:center;color:var(--muted);padding:25px 10px;font-size:12px}.progress{height:7px;background:#e7eff1;border-radius:99px;overflow:hidden;margin-top:7px}.progress i{display:block;height:100%;background:var(--blue);border-radius:99px}.kpi{display:flex;gap:8px;flex-wrap:wrap}.kpi span{background:#f0f7f9;border-radius:99px;padding:6px 9px;font-size:10px;color:#4e7480}
@media(max-width:420px){.grid{grid-template-columns:1fr 1fr}.goal{height:190px}.hero{height:235px}.summary{gap:6px}.stat{padding:10px}}
</style>
</head>
<body>
<div id="app">
<header class="top"><div class="brand">HABIT</div><div class="sub">戻ってこられる習慣化アプリ</div></header>
<main class="main">
<section id="home" class="screen on"></section>
<section id="goals" class="screen"></section>
<section id="rewards" class="screen"></section>
<section id="bank" class="screen"></section>
<section id="photos" class="screen"></section>
</main>
<nav class="bottomNav">
<button data-s="home" class="on"><span class="ico">⌂</span>ホーム</button>
<button data-s="goals"><span class="ico">▦</span>目標</button>
<button data-s="rewards"><span class="ico">🎁</span>ご褒美</button>
<button data-s="bank"><span class="ico">¥</span>hp通帳</button>
<button data-s="photos"><span class="ico">♡</span>写真</button>
</nav>
<button id="fab" class="fab">＋</button>
</div>
<div id="modal" class="modal"><div id="sheet" class="sheet"></div></div>
<script>
const K="habit_v4", COLORS=["#e63946","#f28482","#f6bd60","#ffd166","#8ac926","#52b788","#2a9d8f","#00b4d8","#277da1","#4361ee","#7209b7","#b5179e","#ff70a6","#ff9f1c","#bc6c25","#6a994e","#386641","#577590","#6d597a","#9a8c98","#555","#222","#fff","#ddd"], MSG=["おかえり。","今日も一歩。","今日も頑張ろう。","お疲れさま。","またここから。","この調子。","あと少し。"];
let S=JSON.parse(localStorage.getItem(K)||"null");
if(!S){S={goals:[],hp:0,logs:[],rewards:{5000:[],2500:[],500:[]},photos:[]}}
let T=null;
const $=s=>document.querySelector(s), esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const save=()=>localStorage.setItem(K,JSON.stringify(S));
const day=(offset=0)=>{const d=new Date();d.setDate(d.getDate()+offset);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
function hpToday(){return S.logs.filter(x=>x.date===today()&&x.n>0&&x.kind!=="system").reduce((a,x)=>a+x.n,0)}
function addLog(n,r,kind="normal"){S.hp+=n;S.logs.unshift({date:today(),n,r,kind});save()}
function randomPhoto(){return S.photos.length?S.photos[Math.floor(Math.random()*S.photos.length)]:""}
function remaining(g){return Math.max(0,Math.ceil((new Date(g.targetDate)-new Date(today()))/86400000)+1)}
function stage(g){const p=Math.min(1,g.done.length/Math.max(1,g.targetDays));return p<.2?1:p<.4?2:p<.6?3:p<.8?4:5}
function streak(g){const set=new Set(g.done||[]);let n=0;for(let i=0;i<999;i++){if(set.has(day(-i)))n++;else break}return n}
function returnBonus(g){if(g.returnBonusDate===today())return;if(!g.tasks?.length)return;const active=g.tasks.filter(t=>t.frequency!=="休息日");if(!active.length)return;const yesterday=day(-1);const missed=active.some(t=>!(t.done||[]).includes(yesterday));const resumed=active.some(t=>(t.done||[]).includes(today()));if(missed&&resumed){addLog(10,"再開："+g.name,"normal");g.returnBonusDate=today();save()}}
function runReturnBonuses(){S.goals.forEach(returnBonus)}
function render(){runReturnBonuses();home();goals();rewards();bank();photos()}
function home(){const p=randomPhoto(),m=MSG[Math.floor(Math.random()*MSG.length)],all=[];S.goals.forEach(g=>(g.tasks||[]).forEach((t,i)=>{if(t.frequency!=="休息日"&&!t.done.includes(today()))all.push({g,t,i})}));
let cards=S.goals.map(g=>{const im=g.images?.[stage(g)]||"";return `<div class="goal" style="background:${g.color}">${im?`<img src="${im}">`:""}<div class="goalText"><span class="tag">${esc(g.tag||"習慣")}</span><b>${esc(g.name)}</b><div class="small">あと${remaining(g)}日　継続${streak(g)}日　達成${g.done.length}/${g.targetDays}日</div><div class="progress"><i style="width:${Math.min(100,g.done.length/g.targetDays*100)}%"></i></div></div></div>`}).join("");
$("#home").innerHTML=`<div class="hero">${p?`<img src="${p}">`:""}<div class="heroText"><div class="heroMsg">${m}</div><div class="heroMeta">今日 ${hpToday()}hp　　累計 ${S.hp}hp</div></div></div><div class="summary"><div class="stat"><b>${S.goals.length}</b><span>目標数</span></div><div class="stat"><b>${S.hp}</b><span>累計hp</span></div><div class="stat"><b>${hpToday()}</b><span>今日のhp</span></div></div><div class="sectionTitle"><h2>今日やること</h2><span class="pill">通常10hp / 最低5hp</span></div><div class="taskCard">${all.length?all.map(x=>`<div class="task"><button class="check" onclick="doTask('${x.g.id}',${x.i},10)">○</button><div class="taskMain"><b>${esc(x.t.normal)}</b><br><small>${esc(x.g.name)}　最低：${esc(x.t.minimum)}</small></div><button class="miniBtn" onclick="doTask('${x.g.id}',${x.i},5)">最低5</button></div>`).join(""):"<div class="empty">今日の行動は全部完了。<br>休むのも行動。</div>"}</div><div class="sectionTitle"><h2>大目標</h2><span class="pill">${S.goals.length}個</span></div><div class="grid">${cards||"<div class=empty>まだ大目標がない。<br>右下の＋から作ろう。</div>"}</div>`}
function goals(){let html=`<div class="sectionTitle"><h2>大目標</h2><button class="primary" onclick="openGoal()">＋ 追加</button></div>`;html+=S.goals.map(g=>`<div class="panel"><div class="row between"><div class="grow"><b>${esc(g.name)}</b><div class="muted">${esc(g.tag||"タグなし")}　・　あと${remaining(g)}日</div></div><button class="secondary" onclick="openGoal('${g.id}')">編集</button></div><div class="kpi" style="margin-top:10px"><span>継続 ${streak(g)}日</span><span>達成 ${g.done.length}/${g.targetDays}日</span><span>${S.hp}hp</span></div><div class="calendar" style="--c:${g.color}">${calendar(g)}</div>${g.tasks.map((t,i)=>`<div class="task"><button class="check ${t.done.includes(today())?"done":""}" onclick="doTask('${g.id}',${i},10)">${t.done.includes(today())?"✓":"○"}</button><div class="taskMain"><b>${esc(t.normal)}</b><br><small>最低：${esc(t.minimum)}${t.reminder?"　・　"+esc(t.reminder):""}</small></div>${t.frequency==="休息日"?`<span class="pill">休息</span>`:""}</div>`).join("")}</div>`).join("");$("#goals").innerHTML=html}
function calendar(g){let arr=[],start=Math.max(0,g.targetDays-60);for(let i=start;i<g.targetDays;i++){const d=new Date(g.startDate);d.setDate(d.getDate()+i);const s=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");arr.push(`<span class="day ${g.done.includes(s)?"done":""} ${s===today()?"today":""}">${d.getDate()}</span>`)}return arr.join("")}
function rewards(){let names={5000:"松",2500:"竹",500:"梅"};$("#rewards").innerHTML=`<div class="sectionTitle"><h2>ご褒美</h2><span class="pill">現在 ${S.hp}hp</span></div>${[5000,2500,500].map(v=>`<div class="reward ${v===5000?"matsu":v===2500?"take":"ume"}"><div class="row between"><div><b>${names[v]}</b><div class="hp">${v}hp</div></div><button class="secondary" onclick="addReward(${v})">＋追加</button></div>${S.rewards[v].map((x,i)=>`<div class="task"><div class="taskMain"><b>${esc(x)}</b></div><button class="miniBtn" onclick="useReward(${v},${i})">使う</button></div>`).join("")||"<div class=empty>まだご褒美がない。</div>"}</div>`).join("")}<div class="notice">ご褒美を使ったら、その日付と内容がhp通帳に残り、累計hpから自動で差し引かれます。</div>`}
function bank(){$("#bank").innerHTML=`<div class="sectionTitle"><h2>hp通帳</h2><span class="pill">残高 ${S.hp}hp</span></div><div class="panel"><div class="stat"><b>${S.hp}</b><span>現在のhp</span></div>${S.logs.map(x=>`<div class="log"><span class="${x.n>=0?"positive":"negative"}"><b>${x.n>=0?"＋":""}${x.n}hp</b></span>　${esc(x.r)}<br><span class="muted">${x.date}</span></div>`).join("")||"<div class=empty>まだ記録がない。</div>"}</div>`}
function photos(){$("#photos").innerHTML=`<div class="sectionTitle"><div><h2>お気に入り写真</h2><div class="muted">ホームを開くたびランダム表示　${S.photos.length}/50枚</div></div><label class="primary">＋追加<input hidden type=file accept="image/*" multiple onchange="addPhotos(event)"></label></div><div class="notice">お気に入り写真は最大50枚。目標ごとの達成画像とは別に管理されます。</div><div class="photos" style="margin-top:12px">${S.photos.map((p,i)=>`<div class="photo"><img src="${p}"><button onclick="S.photos.splice(${i},1);save();render()">×</button></div>`).join("")}</div>`}
function openGoal(id){const o=S.goals.find(g=>g.id===id);T=o?JSON.parse(JSON.stringify(o)):{id:crypto.randomUUID(),name:"",tag:"",targetDate:"",targetDays:30,startDate:today(),color:"#4fa9d8",done:[],returnBonusDate:"",images:["","","","","",""],tasks:[]};$("#sheet").innerHTML=`<div class="sheetHead"><h2 style="margin:0">${o?"大目標を編集":"大目標を作る"}</h2><button class="close" onclick="closeModal()">×</button></div><div class="form"><label>目標名</label><input id="gn" value="${esc(T.name)}" placeholder="目指せ48kg / 日商簿記2級合格"><div class="two"><div><label>目標タグ</label><input id="gt" value="${esc(T.tag)}" placeholder="勉強"></div><div><label>カレンダー</label><select id="week"><option ${T.weekStart!=="sun"?"selected":""}>月曜始まり</option><option ${T.weekStart==="sun"?"selected":""}>日曜始まり</option></select></div></div><label>達成目標日</label><input id="gd" type=date value="${T.targetDate}"><label>日数で設定</label><div class="row"><input id="dn" type=number value="${T.targetDays}"><button class="secondary" onclick="dateByDays()">この日数で計算</button></div><div id="dc" class="notice" style="margin-top:6px"></div><label>達成色</label><div class="colors">${COLORS.map(c=>`<button class="color ${c===T.color?"sel":""}" style="background:${c}" onclick="T.color='${c}';document.querySelectorAll('.color').forEach(x=>x.classList.remove('sel'));this.classList.add('sel')"></button>`).join("")}</div><label>CMYKで色を指定（任意）</label><div class="two"><input id="cy" type=number min=0 max=100 placeholder="C 0-100"><input id="my" type=number min=0 max=100 placeholder="M 0-100"><input id="yk" type=number min=0 max=100 placeholder="Y 0-100"><input id="kk" type=number min=0 max=100 placeholder="K 0-100"></div><button class="secondary" style="margin-top:7px" onclick="applyCMYK()">CMYKの色を適用</button><label>行動目標</label><div id="tasks"></div><button class="secondary" onclick="addTask()">＋ 行動目標を追加</button><label>達成状況画像（5段階）</label><div class="notice">達成率に応じてカード画像が切り替わります。設定しない段階は前の画像を引き継ぎます。</div>${[1,2,3,4,5].map(i=>`<input type=file accept="image/*" onchange="img(event,${i})" style="margin:7px 0">`).join("")}<div class="preview">${[1,2,3,4,5].map(i=>T.images?.[i]?`<img src="${T.images[i]}">`:`<div class="day">${i}</div>`).join("")}</div><div class="row" style="margin-top:15px"><button class="primary grow" onclick="saveGoal('${T.id}',${!!o})">保存</button>${o?`<button class="danger" onclick="delGoal('${T.id}')">削除</button>`:""}</div></div>`;drawTasks();openModal()}
function drawTasks(){$("#tasks").innerHTML=T.tasks.map((t,i)=>`<div class="panel"><label>通常行動（10hp）</label><input id="n${i}" value="${esc(t.normal)}" placeholder="簿記を30分"><label>最低ライン（5hp）</label><input id="m${i}" value="${esc(t.minimum)}" placeholder="問題を1問"><div class="two"><div><label>頻度</label><select id="f${i}"><option ${t.frequency==="毎日"?"selected":""}>毎日</option><option ${t.frequency==="平日"?"selected":""}>平日</option><option ${t.frequency==="土日"?"selected":""}>土日</option><option ${t.frequency==="週3回"?"selected":""}>週3回</option><option ${t.frequency==="休息日"?"selected":""}>休息日</option></select></div><div><label>リマインド</label><input id="r${i}" type=time value="${esc(t.reminder||"")}"></div></div><button class="danger" style="margin-top:9px" onclick="sync();T.tasks.splice(${i},1);drawTasks()">削除</button></div>`).join("")||"<div class=empty>行動目標を追加すると、毎日の入力がぐっと簡単になる。</div>"}
function sync(){T.tasks.forEach((t,i)=>{if($("#n"+i)){t.normal=$("#n"+i).value.trim();t.minimum=$("#m"+i).value.trim();t.frequency=$("#f"+i).value;t.reminder=$("#r"+i).value}})}
function addTask(){sync();T.tasks.push({normal:"",minimum:"",frequency:"毎日",reminder:"",done:[]});drawTasks()}
function dateByDays(){const n=Math.max(1,Number($("#dn").value||1));const d=new Date();T.startDate=today();d.setDate(d.getDate()+n-1);T.targetDate=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");$("#gd").value=T.targetDate;$("#dc").textContent="達成目標は "+T.targetDate+" となります。"}
function cmykToHex(c,m,y,k){c/=100;m/=100;y/=100;k/=100;const r=Math.round(255*(1-c)*(1-k)),g=Math.round(255*(1-m)*(1-k)),b=Math.round(255*(1-y)*(1-k));return "#"+[r,g,b].map(v=>v.toString(16).padStart(2,"0")).join("")}
function applyCMYK(){T.color=cmykToHex(Number($("#cy").value||0),Number($("#my").value||0),Number($("#yk").value||0),Number($("#kk").value||0));document.querySelectorAll('.color').forEach(x=>x.classList.remove('sel'));alert("CMYKから色を設定しました。")}
function img(e,i){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{T.images[i]=r.result;openGoal(T.id)};r.readAsDataURL(f)}
function saveGoal(id,edit){sync();T.name=$("#gn").value.trim();T.tag=$("#gt").value.trim();T.targetDate=$("#gd").value;T.weekStart=$("#week").value==="日曜始まり"?"sun":"mon";if(!T.name||!T.targetDate)return alert("目標名と目標日を入力して。");if(!T.startDate)T.startDate=today();T.targetDays=Math.max(1,Math.ceil((new Date(T.targetDate)-new Date(T.startDate))/86400000)+1);T.tasks=T.tasks.filter(t=>t.normal&&t.minimum);if(edit){const i=S.goals.findIndex(g=>g.id===id);S.goals[i]=T}else{S.goals.push(T);addLog(10,"目標設定","normal")}save();closeModal();render()}
function delGoal(id){if(confirm("この大目標と記録を削除する？")){S.goals=S.goals.filter(g=>g.id!==id);save();closeModal();render()}}
function doTask(id,i,hp){const g=S.goals.find(x=>x.id===id),t=g.tasks[i],d=today();if(t.frequency==="休息日"||t.done.includes(d))return;const earned=Math.min(hp,Math.max(0,50-hpToday()));t.done.push(d);if(earned)addLog(earned,"行動："+g.name+" / "+(hp===10?t.normal:t.minimum),"normal");if(!g.done.includes(d))g.done.push(d);if(g.done.length>=g.targetDays&&!g.finished){g.finished=true;addLog(500,"目標達成："+g.name,"normal")}save();render()}
function addReward(v){const x=prompt(v+"hpのご褒美を入力");if(x?.trim()){S.rewards[v].push(x.trim());save();render()}}
function useReward(v,i){if(S.hp<v)return alert("hpが足りない。");if(confirm("「"+S.rewards[v][i]+"」を今日のご褒美として使う？")){addLog(-v,"ご褒美："+S.rewards[v][i],"reward");render()}}
function addPhotos(e){const files=[...e.target.files].slice(0,50-S.photos.length);files.forEach(f=>{const r=new FileReader();r.onload=()=>{S.photos.push(r.result);save();render()};r.readAsDataURL(f)})}
function openModal(){$("#modal").classList.add("open")}function closeModal(){$("#modal").classList.remove("open")}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));$("#"+id).classList.add('on');document.querySelectorAll('.bottomNav button').forEach(x=>x.classList.toggle('on',x.dataset.s===id));render()}
document.querySelectorAll('.bottomNav button').forEach(b=>b.onclick=()=>show(b.dataset.s));$("#fab").onclick=()=>openGoal();$("#modal").onclick=e=>{if(e.target.id==="modal")closeModal()};
setInterval(()=>{const hm=new Date().toTimeString().slice(0,5),d=today();S.goals.forEach(g=>(g.tasks||[]).forEach(t=>{if(t.reminder===hm&&t.reminderLast!==d&&!t.done.includes(d)&&t.frequency!=="休息日"){t.reminderLast=d;save();alert("HABIT\n"+g.name+"\n今日の行動："+t.normal)}}))},30000);
render();
</script>
</body>
</html>
