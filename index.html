<script>
const KEY='habit_v5';
const OLD_KEY='habit_v4';
const COLORS=['#e85d5d','#f48a8a','#f6bd60','#ffd166','#8ac926','#58b77e','#2a9d8f','#00a9c8','#4f8fc1','#536dfe','#7b4bb7','#b24aa0','#ef70a8','#ff9f43','#bd742e','#6a994e','#386641','#577590','#6d597a','#9a8c98','#555','#222','#fff','#ddd'];
const DEFAULT_MSG=['今日も一歩','がんばろう！','この調子！','目標まであと少し','休息も大事','またここから','おかえり','今日もお疲れさま'];
const DEFAULT_REWARDS={S:{hp:5000,items:[]},A:{hp:2500,items:[]},B:{hp:500,items:[]}};
let S=JSON.parse(localStorage.getItem(KEY)||'null');
if(!S){const old=JSON.parse(localStorage.getItem(OLD_KEY)||'null');if(old){S={goals:old.goals||[],hp:old.hp||0,logs:old.logs||[],rewards:DEFAULT_REWARDS,photos:old.photos||[],reminders:{enabled:true},messages:DEFAULT_MSG.slice(),lastWeekStart:'mon',rewardFilter:'all',bankFilter:'all'};localStorage.setItem(KEY,JSON.stringify(S));}else S={goals:[],hp:0,logs:[],rewards:structuredClone(DEFAULT_REWARDS),photos:[],reminders:{enabled:true},messages:DEFAULT_MSG.slice(),lastWeekStart:'mon',rewardFilter:'all',bankFilter:'all'}}
S.goals=S.goals||[];S.logs=S.logs||[];S.photos=S.photos||[];S.messages=Array.isArray(S.messages)&&S.messages.length?S.messages:DEFAULT_MSG.slice();S.lastWeekStart=S.lastWeekStart||'mon';S.rewardFilter=S.rewardFilter||'all';S.bankFilter=S.bankFilter||'all';S.reminders=S.reminders||{enabled:true};
if(!S.rewards||!S.rewards.S)S.rewards=structuredClone(DEFAULT_REWARDS);['S','A','B'].forEach(r=>{S.rewards[r]=S.rewards[r]||{hp:DEFAULT_REWARDS[r].hp,items:[]};S.rewards[r].hp=Number(S.rewards[r].hp)||DEFAULT_REWARDS[r].hp;S.rewards[r].items=S.rewards[r].items||[]});
S.goals.forEach(g=>{g.images=g.images||['','','','','',''];g.tasks=g.tasks||[];g.done=g.done||[];g.startDate=g.startDate||today();g.targetDate=g.targetDate||g.startDate;g.targetDays=g.targetDays||Math.max(1,Math.ceil((new Date(g.targetDate+'T12:00:00')-new Date(g.startDate+'T12:00:00'))/86400000)+1);g.tasks.forEach(t=>{t.minimum=t.minimum||'';t.restDays=Array.isArray(t.restDays)?t.restDays:[];t.records=t.records||{};t.reminder=t.reminder||'';t.done=(t.done||[]);t.done.forEach(d=>{if(!t.records[d])t.records[d]='normal'});});});
const $=s=>document.querySelector(s), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const dateOffset=n=>{const d=new Date();d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
function icon(type,color){const c=color||'currentColor',common=`fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"`;return `<svg viewBox="0 0 24 24" ${common}><path d="m5 12 4 4L19 6"/></svg>`}
function hpToday(){return S.logs.filter(x=>x.date===today()&&x.n>0).reduce((a,x)=>a+x.n,0)}
function addLog(n,name,kind='normal',meta={}){S.hp+=n;S.logs.unshift({date:today(),n,name,kind,...meta});save()}
function randomPhoto(){return S.photos.length?S.photos[Math.floor(Math.random()*S.photos.length)]:''}
function remaining(g){return Math.max(0,Math.ceil((new Date(g.targetDate+'T12:00:00')-new Date(today()+'T12:00:00'))/86400000)+1)}
function streak(g){const set=new Set(g.done||[]);let n=0;for(let i=0;i<999;i++){if(set.has(dateOffset(-i)))n++;else break}return n}
function stage(g){const imgs=(g.images||[]).slice(1).filter(Boolean).length,p=Math.min(1,(g.done||[]).length/Math.max(1,g.targetDays));if(!imgs)return 0;return Math.min(imgs,Math.max(1,Math.ceil(p*imgs)))}
function goalImage(g){const st=stage(g);return st&&g.images&&g.images[st]?g.images[st]:(g.images||[]).find(Boolean)||''}
function isRestDay(t,d=today()){if(Array.isArray(t.restDays)&&t.restDays.length){return t.restDays.includes(new Date(d+'T12:00:00').getDay())}return false}
function allTasks(){const a=[];S.goals.forEach(g=>(g.tasks||[]).forEach((t,i)=>{if(!isRestDay(t))a.push({g,t,i})}));return a}
function home(){const p=randomPhoto(),m=S.messages[Math.floor(Math.random()*S.messages.length)],all=allTasks();
 const cards=S.goals.map(g=>`<div class="goalCard" onclick="openGoalDetail('${g.id}')">${goalImage(g)?`<img src="${goalImage(g)}">`:''}<div class="goalText"><b>${esc(g.name)}</b><div class="small">あと${remaining(g)}日　・　${streak(g)}日継続</div><span class="glassStat">継続 ${streak(g)}日</span><span class="glassStat">達成 ${g.done.length}／${g.targetDays}日</span><span class="glassStat">大目標達成500HP</span></div></div>`).join('');
 $('#home').innerHTML=`<div class="hero">${p?`<img src="${p}">`:''}<div class="heroText"><div class="heroMsg"><span>${esc(m)}</span></div><div class="heroMeta"><div class="metaSide"><span class="metaLabel">今日のHP</span><span class="metaValue">${hpToday()}／50</span></div><div class="metaSide right"><span class="metaLabel">累計HP</span><span class="metaValue">${S.hp}HP</span></div></div></div></div><div class="sectionTitle"><h2>今日やること</h2><span class="pill">通常10HP　省エネ5HP ／ 1日上限50HP</span></div><div class="taskCard"><div id="todayTasks">${all.length?all.map(taskRow).join(''):`<div class="empty">今日の行動はなし。<br>休むのも行動。</div>`}</div></div><div class="sectionTitle"><h2>大目標</h2><span class="pill">計${S.goals.length}個 ／ 1達成500HP</span></div><div class="goalGrid">${cards||`<div class="empty" style="grid-column:1/-1">まだ目標がない。<br>「目標」から追加しよう。</div>`}</div>`}
function taskRow(x){const d=today(),mode=x.t.records?.[d]||'',done=!!mode;return `<div class="task ${done?'completedTask':'activeTask'}"><button class="taskActionBtn ${mode?'on '+mode:''}" onclick="event.stopPropagation();selectTask('${x.g.id}',${x.i},'normal')">${mode==='normal'?'✓':'○'}</button><div class="taskText ${done?'done':''}"><div class="taskType">通常</div><b>${esc(x.t.normal)}</b></div><button class="taskActionBtn ${mode==='minimum'?'on minimum':''}" onclick="event.stopPropagation();selectTask('${x.g.id}',${x.i},'minimum')">${mode==='minimum'?'✓':'○'}</button><div class="taskSide ${done?'done':''}"><div class="taskType">省エネ</div><b>${esc(x.t.minimum)}</b></div></div>`}
function selectTask(id,i,mode){const g=S.goals.find(x=>x.id===id),t=g?.tasks?.[i],d=today();if(!g||!t||isRestDay(t,d))return;const old=t.records?.[d]||null;if(old===mode)return;const oldHp=old==='normal'?10:old==='minimum'?5:0;const newHp=mode==='normal'?10:5;const current=hpToday();const base=current-oldHp;const earned=Math.min(newHp,Math.max(0,50-base));S.logs=S.logs.filter(x=>!(x.date===d&&x.goalId===id&&x.taskIndex===i));if(earned>0){S.hp+=earned;S.logs.unshift({date:d,n:earned,name:`【${g.name}】 ${mode==='normal'?t.normal:t.minimum}`,kind:mode,goalId:id,taskIndex:i});}t.records=t.records||{};t.records[d]=mode;t.done=t.done||[];if(!t.done.includes(d))t.done.push(d);g.done=g.done||[];if(!g.done.includes(d))g.done.push(d);if(g.done.length>=g.targetDays&&!g.finished){g.finished=true;S.hp+=500;S.logs.unshift({date:d,n:500,name:`【${g.name}】 大目標達成`,kind:'achieve',goalId:id});}save();render()}
function goals(){const rows=S.goals.map(g=>`<div class="goalListCard" onclick="openGoalDetail('${g.id}')"><div class="goalListPhoto">${goalImage(g)?`<img src="${goalImage(g)}">`:''}</div><div class="goalInfo"><h3>${esc(g.name)}</h3><div class="muted">あと${remaining(g)}日　・　${streak(g)}日継続</div><div class="goalInfoRow"><span class="chip">達成 ${g.done.length}／${g.targetDays}日</span><span class="chip">達成率 ${Math.round(g.done.length/Math.max(1,g.targetDays)*100)}%</span></div><div class="progress"><i style="width:${Math.min(100,Math.round(g.done.length/Math.max(1,g.targetDays)*100))}%"></i></div></div></div>`).join('');$('#goals').innerHTML=`<div class="sectionTitle"><h2>目標</h2><button class="goalAdd" onclick="openGoalForm()">＋</button></div>${rows||'<div class="empty">まだ目標がない。</div>'}`}
function rewards(){const filter=S.rewardFilter||'all',items=[];['S','A','B'].forEach(r=>{if(filter!=='all'&&filter!==r)return;(S.rewards[r].items||[]).forEach((item,i)=>items.push(rewardTicket(r,item,i)))});$('#rewards').innerHTML=`<div class="sectionTitle rewardHeader"><h2>ご褒美</h2><div class="rewardHeadRight"><span class="balance">残高 ${S.hp}HP</span><button class="rewardAdd" onclick="openRewardAdd()">＋</button></div></div><div class="filterRow">${[['all','すべて'],['S','Sランク'],['A','Aランク'],['B','Bランク']].map(([k,v])=>`<button class="filterBtn ${filter===k?'on':''}" onclick="S.rewardFilter='${k}';save();rewards()">${v}</button>`).join('')}</div>${items.join('')||'<div class="empty">登録したご褒美はここに表示される。</div>'}`}
function rewardTicket(r,item,i){const hp=S.rewards[r].hp;return `<div class="ticket ticket${r}" onclick="openRewardDetail('${r}')"><div class="ticketInner"></div><div class="ticketStub"><div class="reward">Reward</div><div class="big">TICKET</div><div class="for">for</div><div class="you">YOU</div><div class="hp">${hp}HP</div></div><div class="ticketBody"><div class="ticketQuote">You earned this after all that effort.</div><div class="ticketCongrats">Congratulations!</div><div class="ticketName">${esc(item.name)}</div><div class="ticketRank">Rank${r}</div><div class="hrSeal"><span>HR</span></div><div class="laurelSeal"><svg viewBox="0 0 70 70"><path d="M19 54C8 43 8 24 18 13M19 53c7-4 10-9 12-15M18 42c-4-1-7-4-9-7M18 34c-4-1-7-3-9-6M20 25c-4-2-6-4-8-7M21 18c-3-2-4-4-5-6M51 54c11-11 11-30 1-41M51 53c-7-4-10-9-12-15M52 42c4-1 7-4 9-7M52 34c4-1 7-3 9-6M50 25c4-2 6-4 8-7M49 18c3-2 4-4 5-6M35 57V13"/></svg></div></div></div>`}
function bank(){const filter=S.bankFilter||'all',logs=S.logs.filter(x=>filter==='all'||x.kind===filter);const label={normal:'通常',minimum:'省エネ',achieve:'達成',reward:'ご褒美'};const color={normal:'blueText',minimum:'greenText',achieve:'orangeText',reward:'redText'};$('#bank').innerHTML=`<div class="sectionTitle balanceHead"><h2>HP通帳</h2><span class="balance">残高 ${S.hp}HP</span></div><div class="filterRow">${[['all','すべて'],['normal','通常'],['minimum','省エネ'],['achieve','達成'],['reward','ご褒美']].map(([k,v])=>`<button class="filterBtn ${filter===k?'on':''}" onclick="S.bankFilter='${k}';save();bank()">${v}</button>`).join('')}</div><div class="panel">${logs.map(x=>{let name=x.name||'';if(x.kind==='reward'&&x.rank)name=`【${x.rank}ランク】 ${name.replace(/^ご褒美：/,'')}`;let iconName=x.kind==='normal'?'normal':x.kind==='minimum'?'minimum':x.kind==='achieve'?'achieve':'reward';const c=x.kind==='normal'?'#55acd7':x.kind==='minimum'?'#69b98e':x.kind==='achieve'?'#e89b45':'#df6d70';return `<div class="bankLog"><span class="logIcon" style="background:${c}18">${icon(iconName,c)}</span><div class="logText"><b>${esc(name)}</b><small>${x.date}</small></div><span class="logHp ${color[x.kind]}">${x.n>0?'+':''}${x.n}HP</span></div>`}).join('')||'<div class="empty">まだ記録がない。</div>'}</div>`}
function settings(){const count=S.photos.length;$('#settings').innerHTML=`<div class="sectionTitle"><h2>設定</h2></div><div class="panel"><div class="settingRow"><div><b>リマインド</b><small>行動目標ごとの時刻設定</small></div><button class="secondary" onclick="openReminderSettings()">設定</button></div><div class="settingRow"><div><b>リマインド有効</b><small>アプリを開いている間に時刻を確認</small></div><button class="toggle ${S.reminders.enabled?'on':''}" onclick="S.reminders.enabled=!S.reminders.enabled;save();settings()"><i></i></button></div><div class="settingRow"><div><b>ランダムメッセージ</b><small>${S.messages.length}個を設定</small></div><button class="secondary" onclick="openMessageSettings()">編集</button></div><div class="settingRow"><div><b>ランダム写真</b><small>${count}／100枚　起動時ランダム表示</small></div><button class="secondary" onclick="openPhotoManager()">管理</button></div><div class="settingRow"><div><b>ご褒美HP</b><small>S ${S.rewards.S.hp}HP　・　A ${S.rewards.A.hp}HP　・　B ${S.rewards.B.hp}HP</small></div><button class="secondary" onclick="openRewardSettings()">変更</button></div></div>`}
function openGoalDetail(id){const g=S.goals.find(x=>x.id===id);if(!g)return;const cal=[];for(let i=0;i<Math.min(g.targetDays,70);i++){const d=new Date(g.startDate+'T12:00:00');d.setDate(d.getDate()+i);const s=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;cal.push(`<span class="day ${g.done.includes(s)?'done':''} ${s===today()?'today':''}" style="--c:${g.color||'#55acd7'}"><span>${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}</span></span>`)}const rest=t=>t.restDays?.length?t.restDays.map(x=>['日','月','火','水','木','金','土'][x]).join('・'):'なし';$('#sheet').innerHTML=`<div class="sheetHead"><h2 style="margin:0">目標詳細</h2><button class="close" onclick="closeModal()">×</button></div><div class="detailHero">${goalImage(g)?`<img src="${goalImage(g)}">`:''}<div class="detailHeroText"><h2>${esc(g.name)}</h2><p>あと${remaining(g)}日　・　${streak(g)}日継続</p></div></div><div class="kpi"><span class="pill">継続 ${streak(g)}日</span><span class="pill">達成 ${g.done.length}／${g.targetDays}日</span><span class="pill">達成率 ${Math.round(g.done.length/Math.max(1,g.targetDays)*100)}%</span></div><h3>行動目標</h3><div class="actionSummary">${g.tasks.map(t=>`<div class="topline">通常：${esc(t.normal)} ／ 省エネ：${esc(t.minimum)}</div><div class="bottomline">休息日：${rest(t)} ／ リマインド：${t.reminder?esc(t.reminder):'なし'}</div>`).join('<div style="height:10px"></div>')||'<div class="empty">行動目標なし</div>'}</div><h3>達成カレンダー</h3><div class="panel"><div class="calendar" style="--c:${g.color||'#55acd7'}">${cal.join('')}</div></div><div class="detailButtons"><button class="primary" onclick="closeModal();openGoalForm('${g.id}')">編集</button><button class="danger" onclick="deleteGoal('${g.id}')">削除</button></div>`;openModal()}
function captureGoalFields(){if(!T)return;T.name=$('#gn')?.value??T.name;T.weekStart=$('#week')?.value??T.weekStart;T.targetDate=$('#gd')?.value??T.targetDate;syncTasks()}
function openGoalForm(id){const g=S.goals.find(x=>x.id===id);T=g?JSON.parse(JSON.stringify(g)):{id:'g'+Date.now(),name:'',weekStart:S.lastWeekStart,targetDate:today(),startDate:today(),targetDays:1,images:['','','','','',''],tasks:[],done:[],finished:false};drawGoalForm();openModal()}
function drawGoalForm(){const exists=S.goals.some(g=>g.id===T.id);$('#sheet').innerHTML=`<div class="sheetHead"><h2 style="margin:0">${exists?'目標編集':'目標設定'}</h2><button class="close" onclick="closeModal()">×</button></div><div class="form"><label>大目標</label><input id="gn" value="${esc(T.name)}" placeholder="目指せ48kg ／ 日商簿記2級合格"><label>カレンダー</label><select id="week"><option value="mon" ${T.weekStart==='mon'?'selected':''}>月曜始まり</option><option value="sun" ${T.weekStart==='sun'?'selected':''}>日曜始まり</option></select><label>達成目標日</label><input id="gd" type="date" value="${T.targetDate||today()}"><label>行動目標</label><div id="tasks"></div><button type="button" class="secondary" onclick="addTask()">＋ 行動目標を追加</button><label>達成状況画像</label><div class="notice">1～5枚の好きな枚数を登録できます。登録枚数に応じて達成率を按分します。</div>${[1,2,3,4,5].map(i=>`<div class="imagePick"><div class="muted">画像 ${i}</div><label class="filePicker"><span>${T.images?.[i]?'登録済み':'ファイルを選択'}</span><input type="file" accept="image/*" onchange="setGoalImage(event,${i})"></label></div>`).join('')}<div class="goalSaveArea"><button type="button" class="primary" onclick="saveGoalForm()">保存</button>${exists?`<button type="button" class="danger" onclick="deleteGoal('${T.id}')">削除</button>`:''}</div><div class="formBottomPad"></div></div>`;drawTasks()}
function drawTasks(){const box=$('#tasks');box.innerHTML=T.tasks.map((t,i)=>`<div class="taskPanel"><label>通常行動（10HP）</label><input id="n${i}" value="${esc(t.normal)}" placeholder="簿記を30分"><label>省エネ行動（5HP）</label><input id="m${i}" value="${esc(t.minimum)}" placeholder="問題を1問"><label>休息日</label><div class="restDays">${[['日',0],['月',1],['火',2],['水',3],['木',4],['金',5],['土',6]].map(([name,v])=>`<label><input type="checkbox" id="d${i}_${v}" ${t.restDays?.includes(v)?'checked':''}><span>${name}</span></label>`).join('')}</div><label>リマインド</label><input id="r${i}" type="time" value="${esc(t.reminder||'00:00')}"><button type="button" class="danger" style="margin-top:9px" onclick="syncTasks();T.tasks.splice(${i},1);drawGoalForm()">削除</button></div>`).join('')||'<div class="empty">行動目標を追加すると、今日やることが自動で表示される。</div>'}
function syncTasks(){if(!T)return;T.tasks.forEach((t,i)=>{const n=$('#n'+i);if(n){t.normal=n.value.trim();t.minimum=$('#m'+i).value.trim();t.restDays=[0,1,2,3,4,5,6].filter(v=>$('#d'+i+'_'+v)?.checked);t.reminder=$('#r'+i).value||'00:00'}})}
function addTask(){captureGoalFields();T.tasks.push({normal:'',minimum:'',restDays:[],reminder:'00:00',done:[],records:{}});drawGoalForm()}
function setGoalImage(e,i){captureGoalFields();const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{T.images=T.images||['','','','','',''];T.images[i]=r.result;drawGoalForm()};r.readAsDataURL(f)}
function saveGoalForm(){captureGoalFields();T.name=T.name.trim();T.targetDate=T.targetDate||today();T.weekStart=T.weekStart||S.lastWeekStart||'mon';T.startDate=T.startDate||today();T.targetDays=Math.max(1,Math.ceil((new Date(T.targetDate+'T12:00:00')-new Date(T.startDate+'T12:00:00'))/86400000)+1);T.images=T.images||['','','','','',''];T.tasks=T.tasks.filter(t=>t.normal&&t.minimum);if(!T.name)return alert('大目標を入力して。');S.lastWeekStart=T.weekStart;const i=S.goals.findIndex(g=>g.id===T.id);if(i>=0)S.goals[i]=T;else{S.goals.push(T);S.hp+=10;S.logs.unshift({date:today(),n:10,name:`【${T.name}】 目標設定`,kind:'normal',goalId:T.id});}save();closeModal();render()}
function deleteGoal(id){if(confirm('この目標と記録を削除する？')){S.goals=S.goals.filter(g=>g.id!==id);save();closeModal();render()}}
function openRewardDetail(rank){const o=S.rewards[rank];$('#sheet').innerHTML=`<div class="sheetHead"><div><h2 style="margin:0">${rank}ランク</h2><div class="muted">1件 ${o.hp}HP</div></div><button class="close" onclick="closeModal()">×</button></div><div class="panel">${o.items.map((x,i)=>`<div class="bankLog"><div class="logText"><b>${esc(x.name)}</b><small>${x.date?'登録日 '+x.date:''}</small></div><button class="primary" onclick="useReward('${rank}',${i})">使う</button><button class="danger" onclick="deleteReward('${rank}',${i})">削除</button></div>`).join('')||'<div class="empty">まだご褒美がない。</div>'}</div>`;openModal()}
function openRewardAdd(){const r=S.rewardFilter&&S.rewardFilter!=='all'?S.rewardFilter:'S';$('#sheet').innerHTML=`<div class="sheetHead"><h2 style="margin:0">ご褒美設定</h2><button class="close" onclick="closeModal()">×</button></div><div class="panel form"><label>ランク</label><select id="rewardRank"><option value="S" ${r==='S'?'selected':''}>Sランク</option><option value="A" ${r==='A'?'selected':''}>Aランク</option><option value="B" ${r==='B'?'selected':''}>Bランク</option></select><label>ご褒美</label><input id="rewardName" placeholder="ご褒美内容を入力"><button class="primary" style="margin-top:14px" onclick="saveNewReward()">登録</button></div>`;openModal()}
function saveNewReward(){const r=$('#rewardRank').value,name=$('#rewardName').value.trim();if(!name)return alert('ご褒美内容を入力して。');S.rewards[r].items.push({name,date:today()});save();closeModal();rewards()}
function deleteReward(rank,i){S.rewards[rank].items.splice(i,1);save();openRewardDetail(rank);rewards()}
function useReward(rank,i){const o=S.rewards[rank],item=o.items[i];if(S.hp<o.hp)return alert('HPが足りない。');if(confirm('「'+item.name+'」を今日のご褒美として使う？')){S.hp-=o.hp;S.logs.unshift({date:today(),n:-o.hp,name:item.name,kind:'reward',rank});save();closeModal();render()}}
function openRewardSettings(){const vals=S.rewards;$('#sheet').innerHTML=`<div class="sheetHead"><h2 style="margin:0">ご褒美HP</h2><button class="close" onclick="closeModal()">×</button></div><div class="panel form"><label>Sランク</label><input id="rs" type="number" min="1" value="${vals.S.hp}"><label>Aランク</label><input id="ra" type="number" min="1" value="${vals.A.hp}"><label>Bランク</label><input id="rb" type="number" min="1" value="${vals.B.hp}"><button class="primary" style="margin-top:14px" onclick="saveRewardSettings()">保存</button></div>`;openModal()}
function saveRewardSettings(){S.rewards.S.hp=Math.max(1,Number($('#rs').value));S.rewards.A.hp=Math.max(1,Number($('#ra').value));S.rewards.B.hp=Math.max(1,Number($('#rb').value));save();closeModal();render()}
function openMessageSettings(){const msgs=S.messages.slice();$('#sheet').innerHTML=`<div class="sheetHead"><h2 style="margin:0">ランダムメッセージ</h2><button class="close" onclick="closeModal()">×</button></div><div class="notice">起動時にこの中からランダムで1つ表示します。自由に変更できます。</div><div class="panel messageList">${msgs.map((m,i)=>`<div class="messageRow"><textarea id="msg${i}">${esc(m)}</textarea><button class="danger" onclick="S.messages.splice(${i},1);save();openMessageSettings()">削除</button></div>`).join('')}<button class="secondary" onclick="S.messages.push('');save();openMessageSettings()">＋ メッセージを追加</button><button class="primary" style="margin-left:6px" onclick="saveMessages()">保存</button></div>`;openModal()}
function saveMessages(){S.messages=[...Array(S.messages.length)].map((_,i)=>$('#msg'+i)?.value.trim()).filter(Boolean);if(!S.messages.length)S.messages=DEFAULT_MSG.slice();save();closeModal();render()}
function openReminderSettings(){const rows=[];S.goals.forEach(g=>(g.tasks||[]).forEach((t,i)=>rows.push(`<div class="settingRow"><div><b>${esc(g.name)}</b><small>${esc(t.normal)}</small></div><input type="time" value="${esc(t.reminder||'00:00')}" onchange="setReminder('${g.id}',${i},this.value)" style="width:110px;padding:8px;border:1px solid var(--line);border-radius:11px;background:#fff"></div>`)));$('#sheet').innerHTML=`<div class="sheetHead"><h2 style="margin:0">リマインド</h2><button class="close" onclick="closeModal()">×</button></div><div class="panel">${rows.join('')||'<div class="empty">先に目標と行動目標を作って。</div>'}</div>`;openModal()}
function setReminder(id,i,v){const g=S.goals.find(x=>x.id===id);if(g&&g.tasks[i]){g.tasks[i].reminder=v;save()}}
function openPhotoManager(){const max=100;$('#sheet').innerHTML=`<div class="sheetHead"><div><h2 style="margin:0">写真</h2><div class="muted">${S.photos.length}／${max}枚</div></div><button class="close" onclick="closeModal()">×</button></div><div class="notice">お気に入り写真は起動時にランダム表示。各目標の達成状況画像とは別管理。</div><label class="primary" style="display:inline-block;margin-top:12px">＋ 写真を追加<input hidden type="file" accept="image/*" multiple onchange="addPhotos(event)"></label><div class="photos" style="display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px">${S.photos.map((p,i)=>`<div style="aspect-ratio:1;overflow:hidden;border-radius:13px;position:relative;background:#e9f1f3"><img src="${p}" style="width:100%;height:100%;object-fit:cover"><button style="position:absolute;right:4px;top:4px;border:0;background:#10222b99;color:#fff;border-radius:50%;width:24px;height:24px" onclick="S.photos.splice(${i},1);save();openPhotoManager();settings()">×</button></div>`).join('')}</div>`;openModal()}
function addPhotos(e){const files=[...e.target.files].slice(0,100-S.photos.length);files.forEach(f=>{const r=new FileReader();r.onload=()=>{S.photos.push(r.result);save();openPhotoManager();settings()};r.readAsDataURL(f)})}
function openModal(){$('#modal').classList.add('open')};function closeModal(){$('#modal').classList.remove('open')};
function render(){home();goals();rewards();bank();settings()}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));$('#'+id).classList.add('on');document.querySelectorAll('.bottomNav button').forEach(x=>x.classList.toggle('on',x.dataset.s===id));render()}
document.querySelectorAll('.bottomNav button').forEach(b=>b.addEventListener('click',()=>show(b.dataset.s)));$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
setInterval(()=>{if(!S.reminders.enabled)return;const hm=new Date().toTimeString().slice(0,5),d=today();S.goals.forEach(g=>(g.tasks||[]).forEach(t=>{if(t.reminder===hm&&t.reminderLast!==d&&!t.records?.[d]&&!isRestDay(t,d)){t.reminderLast=d;save();alert('HABIT\n'+g.name+'\n今日の行動：'+t.normal)}}))},30000);
render();
</script>
</body>
</html>
