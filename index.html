rder-radius:26px 26px 0 0;padding:18px;max-height:92vh;overflow:auto}.sheetHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.close{border:0;background:#eaf2f4;border-radius:50%;width:34px;height:34px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}.day{aspect-ratio:1;border-radius:8px;display:grid;place-items:center;font-size:9px;background:#edf3f5;color:#73858c}.day.done{background:var(--c,#55acd7);color:#fff;font-weight:800}.day.today{outline:2px solid #18313b}.empty{text-align:center;color:var(--muted);padding:25px 10px;font-size:12px}.bottomNav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(760px,100%);z-index:30;padding:7px 8px calc(7px + env(safe-area-inset-bottom));background:rgba(255,255,255,.93);backdrop-filter:blur(18px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);gap:2px}.bottomNav button{border:0;background:transparent;color:#7c9097;font-size:9px;padding:5px 2px}.bottomNav button.on{color:#2787af;font-weight:800}.bottomNav .ico{height:22px;display:grid;place-items:center;margin-bottom:2px}.bottomNav svg{width:20px;height:20px}.settingRow{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid #edf2f3}.settingRow:last-child{border-bottom:0}.settingRow b{font-size:13px}.settingRow small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.toggle{width:44px;height:26px;border:0;border-radius:99px;background:#ccdadd;padding:3px}.toggle i{display:block;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}.toggle.on{background:var(--blue)}.toggle.on i{transform:translateX(18px)}.detailHero{height:245px;border-radius:23px;overflow:hidden;position:relative;background:#dcecef;margin-bottom:12px}.detailHero img{width:100%;height:100%;object-fit:cover}.detailHero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 38%,rgba(10, <script>
const KEY='habit_v5';
const OLD_KEY='habit_v4';
const COLORS=['#e85d5d','#f48a8a','#f6bd60','#ffd166','#8ac926','#58b77e','#2a9d8f','#00a9c8','#4f8fc1','#536dfe','#7b4bb7','#b24aa0','#ef70a8','#ff9f43','#bd742e','#6a994e','#386641','#577590','#6d597a','#9a8c98','#555','#222','#fff','#ddd'];
const DEFAULT_MSG=['今日も一歩','がんばろう！','この調子！','目標まであと少し','休息も大事','またここから','おかえり','今日もお疲れさま'];
let MSG=DEFAULT_MSG.slice();
const DEFAULT_REWARDS={S:{hp:5000,items:[]},A:{hp:2500,items:[]},B:{hp:500,items:[]}};
let S=JSON.parse(localStorage.getItem(KEY)||'null');
if(!S){
  const old=JSON.parse(localStorage.getItem(OLD_KEY)||'null');
  if(old){
    const oldRewards=old.rewards||{};
    S={goals:old.goals||[],hp:old.hp||0,logs:old.logs||[],rewards:{S:{hp:5000,items:[]},A:{hp:2500,items:[]},B:{hp:500,items:[]}},photos:old.photos||[],reminders:{enabled:true}};
    Object.entries({S:5000,A:2500,B:500}).forEach(([r,hp])=>{
      const items=oldRewards[hp]||[];
      S.rewards[r].items=items.map(x=>typeof x==='string'?{name:x,date:''}:x);
    });
    localStorage.setItem(KEY,JSON.stringify(S));
  }else S={goals:[],hp:0,logs:[],rewards:DEFAULT_REWARDS,photos:[],reminders:{enabled:true}};
}
if(!S.rewards||!S.rewards.S){S.rewards=DEFAULT_REWARDS}
if(!S.reminders)S.reminders={enabled:true};
if(!Array.isArray(S.messages))S.messages=DEFAULT_MSG.slice();
if(!S.messageRandom)S.messageRandom=true;
if(!S.lastWeekStart)S.lastWeekStart='mon';
if(!S.rewardFilter)S.rewardFilter='all';
if(!S.bankFilter)S.bankFilter='all';
if(!S.goals)S.goals=[];
S.logs=S.logs||[];S.logs.forEach(x=>{if(x.kind==='return')x.kind='normal'});
S.goals.forEach(g=>{g.images=g.images||['','','','','',''];g.tasks=g.tasks||[];g.done=g.done||[];g.restDays=g.restDays||[];g.tasks.forEach(t=>{t.minimum=t.minimum||'';t.restDays=Array.isArray(t.restDays)?t.restDays:[];});});
MSG=S.messages.length?S.messages:DEFAULT_MSG.slice();
let T=null;
const $=s=>document.querySelector(s), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const dateOffset=n=>{const d=new Date();d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
function icon(type,color){const c=color||'currentColor';const common=`fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"`;
 if(type==='normal')return `<svg viewBox="0 0 24 24" ${common}><path d="m5 12 4 4L19 6"/></svg>`;
 if(type==='minimum')return `<svg viewBox="0 0 24 24" ${common}><path d="M12 21c5-3 7-7.3 6.2-12-3.2.4-5.7 2-7.1 4.7C10.5 9.5 8.6 7.6 5 7.1 4.2 12.1 6.4 17.7 12 21Z"/><path d="M12 20c-.6-4.7.4-8.4 4.3-11.2"/></svg>`;
 if(type==='achieve')return `<svg viewBox="0 0 24 24" ${common}><path d="M7 4h10v5c0 4-2.1 6-5 6s-5-2-5-6V4Z"/><path d="M7 6H4v2c0 3 1.5 4.5 4 4.5M17 6h3v2c0 3-1.5 4.5-4 4.5M12 15v4M8 20h8"/></svg>`;
 if(type==='reward')return `<svg viewBox="0 0 24 24" ${common}><path d="M4 8h16v12H4z"/><path d="M12 8v12M4 12h16"/><path d="M12 8H8.5C6 8 5.5 5 7.5 4c2.3-1.1 4.5 2.7 4.5 4ZM12 8h3.5c2.5 0 3-3 1-4-2.3-1.1-4.5 2.7-4.5 4Z"/></svg>`;
 return `<svg viewBox="0 0 24 24" ${common}><path d="M12 3.8 14 5l2.3-.4 1.2 2 2 1.2-.4 2.3 1.2 2-1.2 2 .4 2.3-2 1.2-1.2 2-2.3-.4-2 1.2-2-1.2-2.3.4-1.2-2-2-1.2.4-2.3-1.2-2 1.2-2-.4-2.3 2-1.2 1.2-2L10 5l2-1.2Z"/><circle cx="12" cy="12" r="3.3"/></svg>`;
}
function hpToday(){return S.logs.filter(x=>x.date===today()&&x.n>0).reduce((a,x)=>a+x.n,0)}
function addLog(n,name,kind='normal',meta={}){S.hp+=n;S.logs.unshift({date:today(),n,name,kind,...meta});save()}
function randomPhoto(){return S.photos.length?S.photos[Math.floor(Math.random()*S.photos.length)]:''}
function remaining(g){return Math.max(0,Math.ceil((new Date(g.targetDate)-new Date(today()))/86400000)+1)}
function streak(g){const set=new Set(g.done||[]);let n=0;for(let i=0;i<999;i++){if(set.has(dateOffset(-i)))n++;else break}return n}
function stage(g){const imgs=(g.images||[]).slice(1).filter(Boolean).length;const p=Math.min(1,(g.done||[]).length/Math.max(1,g.targetDays));if(!imgs)return 0;return Math.min(imgs,Math.max(1,Math.ceil(p*imgs)));}
function goalImage(g){const st=stage(g);return st&&g.images&&g.images[st]?g.images[st]:(g.images||[]).find(Boolean)||'';}
function isRestDay(t,d=today()){if(Array.isArray(t.restDays)&&t.restDays.length){const n=new Date(d+'T12:00:00').getDay();return t.restDays.includes(n)}return t.frequency==='休息日';}
function allTasks(){const a=[];S.goals.forEach(g=>(g.tasks||[]).forEach((t,i)=>{if(!isRestDay(t))a.push({g,t,i})}));return a;}
function home(){const p=randomPhoto(),m=MSG[Math.floor(Math.random()*MSG.length)],all=allTasks();
 const cards=S.goals.map(g=>`<div class="goalCard" onclick="openGoalDetail('${g.id}')">${goalImage(g)?`<img src="${goalImage(g)}">`:''}<div class="goalText">${g.tag?`<span class="goalTag">${esc(g.tag)}</span>`:''}<b>${esc(g.name)}</b><div class="small">あと${remaining(g)}日　・　${streak(g)}日継続</div><span class="glassStat">継続 ${streak(g)}日</span><span class="glassStat">達成 ${g.done.length}/${g.targetDays}日</span><span class="glassStat">大目標達成500HP</span></div></div>`).join('');
 $('#home').innerHTML=`<div class="hero">${p?`<img src="${p}">`:''}<div class="heroText"><div class="heroMsg"><span>${esc(m)}</span></div><div class="heroMeta"><div class="metaSide"><span class="metaLabel">今日のHP</span><span class="metaValue">${hpToday()}/50</span></div><div class="metaSide" style="text-align:right"><span class="metaLabel">累計HP</span><span class="metaValue">${S.hp}HP</span></div></div></div></div><div class="sectionTitle"><h2>今日やること</h2><span class="pill">通常10HP　省エネ5HP ／ 1日上限50HP</span></div><div class="taskCard">${all.length?all.map(x=>{const done=x.t.done?.includes(today());return `<div class="task"><button class="check ${done?'done':''}" onclick="event.stopPropagation();doTask('${x.g.id}',${x.i},10)">${done?'✓':'○'}</button><div class="taskMain"><b>${esc(x.t.normal)}</b><br><small>${esc(x.g.name)}　・ 省エネ ${esc(x.t.minimum)}</small></div><div class="taskActions"><button class="miniBtn blue" onclick="event.stopPropagation();doTask('${x.g.id}',${x.i},10)">通常10HP</button><button class="miniBtn green" onclick="event.stopPropagation();doTask('${x.g.id}',${x.i},5)">省エネ5HP</button></div></div>`}).join(''):`<div class="empty">今日の行動は全部完了。<br>休むのも行動。</div>`}</div><div class="sectionTitle"><h2>大目標</h2><span class="pill">計${S.goals.length}個 ／ 1達成500HP</span></div><div class="grid">${cards||`<div class="empty">まだ大目標がない。<br>「目標」から追加しよう。</div>`}</div>`}
function goals(){const cards=S.goals.map(g=>`<div class="goalListCard" onclick="openGoalDetail('${g.id}')"><div class="goalListPhoto">${goalImage(g)?`<img src="${goalImage(g)}">`:''}</div><div class="goalInfo"><h3>${esc(g.name)}</h3><div class="muted">${esc(g.tag||'タグなし')}　・　あと${remaining(g)}日</div><div class="goalInfoRow"><span class="chip">継続 ${streak(g)}日</span><span class="chip">達成 ${g.done.length}/${g.targetDays}</span></div><div class="progress"><i style="width:${Math.min(100,g.done.length/Math.max(1,g.targetDays)*100)}%"></i></div></div></div>`).join('');$('#goals').innerHTML=`<div class="sectionTitle"><h2>目標</h2><button class="goalAdd" onclick="openGoalForm()" aria-label="目標を追加">＋</button></div>${cards||'<div class="panel empty">まだ目標がない。<br>「＋」から作ろう。</div>'}`}
function ticketIcon(rank,color){return icon('reward',color)}
function rewards(){const data=[['S','Sランク','ticketS'],['A','Aランク','ticketA'],['B','Bランク','ticketB']];const filter=S.rewardFilter||'all';const rows=filter==='all'?data:data.filter(x=>x[0]===filter);
 $('#rewards').innerHTML=`<div class="sectionTitle rewardHeader"><div><h2>ご褒美</h2></div><div class="rewardHeadRight"><span class="balance">残高 ${S.hp}HP</span><button class="goalAdd" onclick="openRewardAdd()" aria-label="ご褒美を追加">＋</button></div></div><div class="filterRow rewardFilters">${[['all','すべて'],['S','Sランク'],['A','Aランク'],['B','Bランク']].map(([k,v])=>`<button class="filterBtn ${filter===k?'on':''}" onclick="S.rewardFilter='${k}';save();rewards()">${v}</button>`).join('')}</div>${rows.map(([r,label,cls])=>{const o=S.rewards[r];return o.items.length?o.items.map((item,i)=>rewardTicket(r,label,cls,item,i)).join(''):rewardTicket(r,label,cls,null,0)}).join('')}`}
function rewardTicket(r,label,cls,item,i){const o=S.rewards[r];const name=item?esc(item.name):'ご褒美を登録';return `<div class="ticket ${cls}" onclick="openRewardDetail('${r}')"><div class="ticketBorder"></div><div class="ticketCut left"></div><div class="ticketCut right"></div><div class="ticketLeft"><div class="ticketReward">Reward</div><div class="ticketBig">TICKET</div><div class="ticketFor">for</div><div class="ticketYou">YOU</div><div class="ticketHp">${o.hp}HP</div></div><div class="ticketBody"><div class="ticketQuote">You earned this after all that effort.</div><div class="ticketCongrats">Congratulations!</div><div class="ticketName">${name}</div><div class="ticketRank">Rank ${r}</div><div class="ticketHpMark">HP</div><div class="seal heartSeal">♥</div><div class="seal laurelSeal">❧</div></div></div>`}
function bank(){const labels={all:'すべて',normal:'通常',minimum:'省エネ',achieve:'達成',reward:'ご褒美'};const filter=S.bankFilter||'all';const logs=filter==='all'?S.logs:S.logs.filter(x=>filter==='normal'?(x.kind==='normal'||x.kind==='return'):x.kind===filter);$('#bank').innerHTML=`<div class="sectionTitle bankHeader"><div><h2>HP通帳</h2></div><span class="balance">残高 ${S.hp}HP</span></div><div class="filterRow">${Object.entries(labels).map(([k,v])=>`<button class="filterBtn ${filter===k?'on':''}" onclick="S.bankFilter='${k}';save();bank()">${v}</button>`).join('')}</div><div class="panel">${logs.length?logs.map(x=>{const positive=x.n>=0;const effective=x.kind==='return'?'normal':x.kind;const color=effective==='normal'?'#55acd7':effective==='minimum'?'#69b98e':effective==='achieve'?'#e89b45':'#df6d70';const type=effective==='normal'?'normal':effective==='minimum'?'minimum':effective==='achieve'?'achieve':'reward';let nm=x.name;if(x.kind==='reward'&&x.rank)nm+=` (${x.rank})`;return `<div class="bankLog"><div class="logIcon" style="background:${color}22">${icon(type,color)}</div><div class="logText"><b>${esc(nm)}</b><small>${x.date}</small></div><div class="logHp" style="color:${color}">${positive?'+':''}${x.n}HP</div></div>`}).join(''):`<div class="empty">まだHPの記録がない。</div>`}</div>`}
function settings(){const count=S.photos.length;$('#settings').innerHTML=`<div class="sectionTitle"><h2>設定</h2></div><div class="panel"><div class="settingRow"><div><b>リマインド</b><small>行動目標ごとの時刻設定</small></div><button class="secondary" onclick="openReminderSettings()">設定</button></div><div class="settingRow"><div><b>リマインド有効</b><small>アプリを開いている間に時刻を確認</small></div><button class="toggle ${S.reminders.enabled?'on':''}" onclick="S.reminders.enabled=!S.reminders.enabled;save();settings()"><i></i></button></div><div class="settingRow"><div><b>ランダムメッセージ</b><small>${S.messages.length}個を設定</small></div><button class="secondary" onclick="openMessageSettings()">編集</button></div><div class="settingRow"><div><b>ランダム写真</b><small>${count}/100枚　起動時ランダム表示</small></div><button class="secondary" onclick="openPhotoManager()">写真を管理</button></div><div class="settingRow"><div><b>ご褒美HP</b><small>S ${S.rewards.S.hp}HP　・　A ${S.rewards.A.hp}HP　・　B ${S.rewards.B.hp}HP</small></div><button class="secondary" onclick="openRewardSettings()">変更</button></div></div><div class="panel"><h3 style="margin-top:0">データ</h3><div class="notice">記録と写真はこの端末のブラウザ内に保存されます。テスト中はSafariのWebサイトデータを削除しないでください。</div></div>`}
function render(){home();goals();rewards();bank();settings()}
function checkReturnBonuses(){}
function doTask(id,i,hp){const g=S.goals.find(x=>x.id===id),t=g?.tasks?.[i],d=today();if(!g||!t||isRestDay(t,d)||t.done?.includes(d))return;const earned=Math.min(hp,Math.max(0,50-hpToday()));t.done=t.done||[];t.done.push(d);g.done=g.done||[];if(!g.done.includes(d))g.done.push(d);if(earned>0)addLog(earned,'目標：'+g.name+' / '+(hp===10?t.normal:t.minimum),hp===10?'normal':'minimum');if(g.done.length>=g.targetDays&&!g.finished){g.finished=true;addLog(500,'達成：'+g.name,'achieve')}save();render()}
function openGoalDetail(id){const g=S.goals.find(x=>x.id===id);if(!g)return;const cal=[];for(let i=0;i<Math.min(g.targetDays,70);i++){const d=new Date(g.startDate);d.setDate(d.getDate()+i);const s=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;cal.push(`<span class="day ${g.done.includes(s)?'done':''} ${s===today()?'today':''}" style="--c:${g.color}">${d.getDate()}</span>`)}$('#sheet').innerHTML=`<div class="sheetHead"><h2 style="margin:0">目標詳細</h2><button class="close" onclick="closeModal()">×</button></div><div class="detailHero">${goalImage(g)?`<img src="${goalImage(g)}">`:''}<div class="detailHeroText"><h2>${esc(g.name)}</h2><p>${esc(g.tag||'タグなし')}　・　あと${remaining(g)}日</p></div></div><div class="kpi"><span class="pill">継続 ${streak(g)}日</span><span class="pill">達成 ${g.done.length}/${g.targetDays}日</span><span class="pill">達成率 ${Math.round(g.done.length/Math.max(1,g.targetDays)*100)}%</span></div><h3>行動目標</h3><div class="panel">${g.tasks.map((t,i)=>`<div class="task"><div class="iconLabel"><span class="logIcon" style="background:#55acd722">${icon('normal','#55acd7')}</span><div class="taskMain"><b>${esc(t.normal)}</b><small>省エネ：${esc(t.minimum)}　${t.restDays?.length?'休息日：'+t.restDays.map(x=>['日','月','火','水','木','金','土'][x]).join('・'):'休息日なし'}${t.reminder?'　・　'+esc(t.reminder):''}</small></div></div></div>`).join('')||'<div class="empty">行動目標なし</div>'}</div><h3>達成カレンダー</h3><div class="panel"><div class="calendar" style="--c:${g.color}">${cal.join('')}</div></div><div class="row" style="margin-top:14px"><button class="primary grow" onclick="closeModal();openGoalForm('${g.id}')">目標を編集</button><button class="danger" onclick="deleteGoal('${g.id}')">削除</button></div>`;openModal()}
function openGoalForm(id){const g=S.goals.find(x=>x.id===id);T=g?JSON.parse(JSON.stringify(g)):{id:(crypto.randomUUID?crypto.randomUUID():'g_'+Date.now()+'_'+Math.random().toString(36).slice(2)),name:'',tag:'',targetDate:dateOffset(29),targetDays:30,startDate:today(),weekStart:S.lastWeekStart||'mon',color:'#55acd7',done:[],images:['','','','','',''],tasks:[],returnBonusDate:'',finished:false};drawGoalForm();openModal()}
function captureGoalFields(){if(!T)return;const n=$('#gn'),t=$('#gt'),w=$('#week'),d=$('#gd');if(n)T.name=n.value;if(t)T.tag=t.value;if(w)T.weekStart=w.value;if(d)T.targetDate=d.value;syncTasks()}
function drawGoalForm(){const o=S.goals.some(g=>g.id===T.id);$('#sheet').innerHTML=`<div class="sheetHead"><h2 style="margin:0">${o?'目標を編集':'目標を作る'}</h2><button class="close" onclick="closeModal()">×</button></div><div class="form"><label>大目標</label><input id="gn" value="${esc(T.name)}" placeholder="目指せ48kg / 日商簿記2級合格"><label>タグ名</label><input id="gt" value="${esc(T.tag)}" placeholder="勉強"><label>タグ色</label><div class="colors">${COLORS.map(c=>`<button type="button" class="color ${c===T.color?'sel':''}" style="background:${c}" onclick="captureGoalFields();T.color='${c}';drawGoalForm()"></button>`).join('')}</div><label>カレンダー</label><select id="week"><option value="mon" ${T.weekStart!=='sun'?'selected':''}>月曜始まり</option><option value="sun" ${T.weekStart==='sun'?'selected':''}>日曜始まり</option></select><label>達成目標日</label><input id="gd" type="date" value="${T.targetDate}"><label>行動目標</label><div id="tasks"></div><button type="button" class="secondary" onclick="addTask()">＋ 行動目標を追加</button><label>達成状況画像</label><div class="notice">1～5枚の好きな枚数を登録できます。登録枚数に応じて達成率を按分します。</div><div>${[1,2,3,4,5].map(i=>`<div class="imagePick"><div class="subtle">画像 ${i}</div><label class="filePicker"><span>${T.images?.[i]?'登録済み':'ファイルを選択'}</span><input type="file" accept="image/*" onchange="setGoalImage(event,${i})"></label></div>`).join('')}</div><div class="goalSaveArea"><button type="button" class="primary grow" onclick="saveGoalForm()">保存</button>${o?`<button type="button" class="danger" onclick="deleteGoal('${T.id}')">削除</button>`:''}</div><div class="formBottomPad"></div></div>`;drawTasks()}
function drawTasks(){const box=$('#tasks');box.innerHTML=T.tasks.map((t,i)=>{const days=t.restDays||[];return `<div class="panel"><label>通常行動（10HP）</label><input id="n${i}" value="${esc(t.normal)}" placeholder="簿記を30分"><label>省エネ行動（5HP）</label><input id="m${i}" value="${esc(t.minimum)}" placeholder="問題を1問"><label>休息日</label><div class="restDays">${[['日',0],['月',1],['火',2],['水',3],['木',4],['金',5],['土',6]].map(([name,v])=>`<label><input type="checkbox" id="d${i}_${v}" ${days.includes(v)?'checked':''}><span>${name}</span></label>`).join('')}</div><label>リマインド</label><input id="r${i}" class="reminderInput" type="time" value="${esc(t.reminder||'')}"><button type="button" class="danger" style="margin-top:9px" onclick="syncTasks();T.tasks.splice(${i},1);drawTasks()">削除</button></div>`}).join('')||'<div class="empty">行動目標を追加すると、今日やることが自動で表示される。</div>'}
function syncTasks(){T.tasks.forEach((t,i)=>{const n=$('#n'+i);if(n){t.normal=n.value.trim();t.minimum=$('#m'+i).value.trim();t.restDays=[0,1,2,3,4,5,6].filter(v=>$('#d'+i+'_'+v)?.checked);t.reminder=$('#r'+i).value}})}
function addTask(){captureGoalFields();T.tasks.push({normal:'',minimum:'',restDays:[],reminder:'',done:[]});drawGoalForm()}
function setGoalImage(e,i){captureGoalFields();const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{T.images=T.images||['','','','','',''];T.images[i]=r.result;drawGoalForm()};r.readAsDataURL(f)}
function saveGoalForm(){captureGoalFields();T.name=T.name.trim();T.tag=T.tag.trim();T.targetDate=T.targetDate;T.weekStart=T.weekStart||'mon';T.startDate=T.startDate||today();T.targetDays=Math.max(1,Math.ceil((new Date(T.targetDate+'T12:00:00')-new Date(T.startDate+'T12:00:00'))/86400000)+1);T.images=T.images||['','','','','',''];T.tasks=T.tasks.filter(t=>t.normal&&t.minimum);if(!T.name||!T.targetDate)return alert('目標名と目標日を入力して。');S.lastWeekStart=T.weekStart;const i=S.goals.findIndex(g=>g.id===T.id);if(i>=0)S.goals[i]=T;else{S.goals.push(T);addLog(10,'目標設定：'+T.name,'normal')}save();closeModal();render()}
function deleteGoal(id){if(confirm('この目標と記録を削除する？')){S.goals=S.goals.filter(g=>g.id!==id);save();closeModal();render()}}{if(confirm('この大目標と記録を削除する？')){S.goals=S.goals.filter(g=>g.id!==id);save();closeModal();render()}}
function openRewardDetail(rank){const o=S.rewards[rank];$('#sheet').innerHTML=`<div class="sheetHead"><div><h2 style="margin:0">${rank}ランク</h2><div class="muted">1件 ${o.hp}HP</div></div><button class="close" onclick="closeModal()">×</button></div><div class="panel"><div class="notice">やりたいことを登録して、達成した日に「使う」を押すと累計HPから自動で差し引きます。</div>${o.items.map((x,i)=>`<div class="task"><div class="taskMain"><b>${esc(x.name)}</b><small>${x.date?'登録日 '+x.date:''}</small></div><button class="miniBtn" onclick="useReward('${rank}',${i})">使う</button><button class="danger" onclick="deleteReward('${rank}',${i})">削除</button></div>`).join('')||'<div class="empty">まだご褒美がない。</div>'}</div>`;openModal()}
function openRewardAdd(){const r=S.rewardFilter&&S.rewardFilter!=='all'?S.rewardFilter:'S';$('#sheet').innerHTML=`<div class="sheetHead"><h2 style="margin:0">ご褒美を登録</h2><button class="close" onclick="closeModal()">×</button></div><div class="panel form"><label>ランク選択</label><select id="rewardRank"><option value="S" ${r==='S'?'selected':''}>Sランク</option><option value="A" ${r==='A'?'selected':''}>Aランク</option><option value="B" ${r==='B'?'selected':''}>Bランク</option></select><label>ご褒美名</label><input id="rewardName" placeholder="欲しかったものを入力"><button class="primary" style="margin-top:14px" onclick="saveNewReward()">登録</button></div>`;openModal()}
function saveNewReward(){const r=$('#rewardRank').value,name=$('#rewardName').value.trim();if(!name)return alert('ご褒美名を入力して。');S.rewards[r].items.push({name,date:today()});save();closeModal();rewards()}
function addReward(rank){S.rewardFilter=rank;save();openRewardAdd()}
function deleteReward(rank,i){S.rewards[rank].items.splice(i,1);save();openRewardDetail(rank);rewards()}
function useReward(rank,i){const o=S.rewards[rank],item=o.items[i];if(S.hp<o.hp)return alert('HPが足りない。');if(confirm('「'+item.name+'」を今日のご褒美として使う？')){addLog(-o.hp,'ご褒美：'+item.name,'reward',{rank});closeModal();render()}}
function openRewardSettings(){const vals=S.rewards;$('#sheet').innerHTML=`<div class="sheetHead"><h2 style="margin:0">ご褒美HP</h2><button class="close" onclick="closeModal()">×</button></div><div class="panel form"><label>Sランク</label><input id="rs" type="number" min="1" value="${vals.S.hp}"><label>Aランク</label><input id="ra" type="number" min="1" value="${vals.A.hp}"><label>Bランク</label><input id="rb" type="number" min="1" value="${vals.B.hp}"><button class="primary" style="margin-top:14px" onclick="saveRewardSettings()">保存</button></div>`;openModal()}
function saveRewardSettings(){S.rewards.S.hp=Math.max(1,Number($('#rs').value));S.rewards.A.hp=Math.max(1,Number($('#ra').value));S.rewards.B.hp=Math.max(1,Number($('#rb').value));save();closeModal();render()}
function openMessageSettings(){const msgs=S.messages||DEFAULT_MSG.slice();$('#sheet').innerHTML=`<div class="sheetHead"><h2 style="margin:0">ランダムメッセージ</h2><button class="close" onclick="closeModal()">×</button></div><div class="notice">起動時にこの中からランダムで1つ表示します。8個を初期設定にしていますが、自由に変更できます。</div><div class="panel messageList">${msgs.map((m,i)=>`<div class="messageRow"><textarea id="msg${i}">${esc(m)}</textarea><button onclick="S.messages.splice(${i},1);save();openMessageSettings()">削除</button></div>`).join('')}<button class="secondary" onclick="S.messages.push('');save();openMessageSettings()">＋ メッセージを追加</button><button class="primary" style="margin-left:6px" onclick="saveMessages()">保存</button></div>`;openModal()}
function saveMessages(){S.messages=[...Array(S.messages.length)].map((_,i)=>$('#msg'+i)?.value.trim()).filter(Boolean);if(!S.messages.length)S.messages=DEFAULT_MSG.slice();MSG=S.messages.slice();save();closeModal();render()}
function openReminderSettings(){const rows=[];S.goals.forEach(g=>(g.tasks||[]).forEach((t,i)=>rows.push(`<div class="settingRow"><div><b>${esc(g.name)}</b><small>${esc(t.normal)}</small></div><input type="time" value="${esc(t.reminder||'')}" onchange="setReminder('${g.id}',${i},this.value)" style="width:110px;padding:8px;border:1px solid var(--line);border-radius:11px;background:#fff"></div>`)));$('#sheet').innerHTML=`<div class="sheetHead"><h2 style="margin:0">リマインド</h2><button class="close" onclick="closeModal()">×</button></div><div class="notice">時刻になると、アプリが開いている場合にリマインドを表示します。ロック中の完全なバックグラウンド通知は、このPWAテスト版では保証しません。</div><div class="panel">${rows.join('')||'<div class="empty">先に目標と行動目標を作ってください。</div>'}</div>`;openModal()}
function setReminder(id,i,v){const g=S.goals.find(x=>x.id===id);if(g&&g.tasks[i]){g.tasks[i].reminder=v;save()}}
function openPhotoManager(){const max=100;$('#sheet').innerHTML=`<div class="sheetHead"><div><h2 style="margin:0">写真</h2><div class="muted">${S.photos.length}/${max}枚</div></div><button class="close" onclick="closeModal()">×</button></div><div class="notice">お気に入り写真は起動時にランダム表示。各目標の5段階画像とは別管理です。</div><label class="primary" style="display:inline-block;margin-top:12px">＋ 写真を追加<input hidden type="file" accept="image/*" multiple onchange="addPhotos(event)"></label><div class="photos" style="margin-top:12px">${S.photos.map((p,i)=>`<div class="photo"><img src="${p}"><button onclick="S.photos.splice(${i},1);save();openPhotoManager();settings()">×</button></div>`).join('')}</div>`;openModal()}
function addPhotos(e){const files=[...e.target.files].slice(0,100-S.photos.length);files.forEach(f=>{const r=new FileReader();r.onload=()=>{S.photos.push(r.result);save();openPhotoManager();settings()};r.readAsDataURL(f)})}
function openModal(){$('#modal').classList.add('open')}
function closeModal(){$('#modal').classList.remove('open')}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));$('#'+id).classList.add('on');document.querySelectorAll('.bottomNav button').forEach(x=>x.classList.toggle('on',x.dataset.s===id));render()}
document.querySelectorAll('.bottomNav button').forEach(b=>b.addEventListener('click',()=>show(b.dataset.s)));
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
setInterval(()=>{if(!S.reminders.enabled)return;const hm=new Date().toTimeString().slice(0,5),d=today();S.goals.forEach(g=>(g.tasks||[]).forEach(t=>{if(t.reminder===hm&&t.reminderLast!==d&&!t.done?.includes(d)&&t.frequency!=='休息日'){t.reminderLast=d;save();alert('HABIT\n'+g.name+'\n今日の行動：'+t.normal)}}))},30000);
render();
</script>
</body>
